          }

  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --bg-app: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --bg-input: #FFFFFF;
      --border-main: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --glass-header: rgba(255, 255, 255, 0.90);
      --glass-nav: rgba(255, 255, 255, 0.95);
    }

    html.dark {
      color-scheme: dark;
      --bg-app: #090B10;
      --bg-card: #121620;
      --bg-subtle: #0D111A;
      --bg-input: #0F172A;
      --border-main: #1F2738;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --glass-header: rgba(9, 11, 16, 0.86);
      --glass-nav: rgba(12, 16, 24, 0.95);
    }

    html:not(.dark) {
      color-scheme: light;
    }

    html, body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: 'Tajawal', 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      min-height: 100dvh;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-card {
      background-color: var(--bg-card);
      border-color: var(--border-main);
    }

    .app-subtle {
      background-color: var(--bg-subtle);
      border-color: var(--border-main);
    }

    .app-input {
      background-color: var(--bg-input);
      border-color: var(--border-main);
      color: var(--text-main);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-family: 'Inter', 'Tajawal', sans-serif;
    }

    .glass-header {
      background: var(--glass-header);
      border-color: var(--border-main);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding-top: var(--safe-top);
    }

    .bottom-nav {
      background: var(--glass-nav);
      border-color: var(--border-main);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding-bottom: calc(var(--safe-bottom) + 0.35rem);
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #64748B55; border-radius: 999px; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.30); }
      50% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
    }
    .pulse-today { animation: pulseGlow 2.4s infinite; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.24s ease-out forwards; }

    /* 2D Anatomical Technique Animations */
    .tech-stage { --tech-dur: 2.8s; }
    .tech-stage.slow-mo { --tech-dur: 5.2s; }
    .tech-stage.paused * { animation-play-state: paused !important; }

    @keyframes musclePulse {
      0%, 100% { fill: url(#muscleOrange); opacity: 0.72; filter: drop-shadow(0 0 4px rgba(255,107,43,0.45)); }
      50% { fill: url(#muscleOrangeHot); opacity: 1; filter: drop-shadow(0 0 11px rgba(255,107,43,0.95)); }
    }
    .muscle-glow { animation: musclePulse var(--tech-dur) ease-in-out infinite; }
    .laser-good { stroke: #22C55E; filter: drop-shadow(0 0 6px rgba(34,197,94,0.9)); }
    .laser-bad  { stroke: #EF4444; filter: drop-shadow(0 0 6px rgba(239,68,68,0.9)); }

    @keyframes chestPushY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-28px); }
    }
    .anim-chest-push { animation: chestPushY var(--tech-dur) ease-in-out infinite; }

    @keyframes latPullY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(34px); }
    }
    .anim-lat-pull { animation: latPullY var(--tech-dur) ease-in-out infinite; }

    @keyframes rowPullX {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(26px); }
    }
    .anim-row-pull { animation: rowPullX var(--tech-dur) ease-in-out infinite; }

    @keyframes latRaiseL {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(78deg); }
    }
    @keyframes latRaiseR {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-78deg); }
    }
    .anim-raise-l { transform-origin: 86px 76px; animation: latRaiseL var(--tech-dur) ease-in-out infinite; }
    .anim-raise-r { transform-origin: 154px 76px; animation: latRaiseR var(--tech-dur) ease-in-out infinite; }

    @keyframes shoulderPushY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-34px); }
    }
    .anim-shoulder-push { animation: shoulderPushY var(--tech-dur) ease-in-out infinite; }

    @keyframes curlFlex {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-108deg); }
    }
    .anim-bicep-curl { transform-origin: 122px 118px; animation: curlFlex var(--tech-dur) ease-in-out infinite; }

    @keyframes triPush {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(85deg); }
    }
    .anim-tri-push { transform-origin: 120px 104px; animation: triPush var(--tech-dur) ease-in-out infinite; }

    @keyframes squatMove {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(32px); }
    }
    .anim-squat { animation: squatMove var(--tech-dur) ease-in-out infinite; }

    @keyframes crunchBend {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(36deg); }
    }
    .anim-crunch { transform-origin: 120px 136px; animation: crunchBend var(--tech-dur) ease-in-out infinite; }
  </style>
</head>

      function inferEquipment(ex) {
        if (ex && ex.equipment && EQUIPMENT_META[ex.equipment]) return ex.equipment;
        const txt = ((ex && ex.machine) || '' + ' ' + ((ex && ex.name) || '')).toLowerCase();
        if (txt.includes('cable') || txt.includes('كيبل') || txt.includes('حبل') || txt.includes('pulley')) return 'cable';
        if (txt.includes('barbell') || txt.includes('ez-bar') || txt.includes('بار') || txt.includes('smith') || txt.includes('سميث')) return 'barbell';
        if (txt.includes('dumbbell') || txt.includes('دمبل') || txt.includes(' db ')) return 'dumbbell';
        if (txt.includes('bodyweight') || txt.includes('وزن الجسم') || txt.includes('عقلة') || txt.includes('بلانك')) return 'bodyweight';
        return 'machine';
      }

      function getVariantsForExercise(ex) {
        const hay = ((ex.name || '') + ' ' + (ex.machine || '')).toLowerCase();
        for (const grp of EXERCISE_VARIANT_GROUPS) {
          if (grp.match.some(k => hay.includes(k))) {
            return grp.variants;
          }
        }
        // Fallback: collect up to 3–4 equipment options for this exercise's muscle
        const lib = EXERCISE_LIBRARY[ex.muscle] || EXERCISE_LIBRARY.chest;
        const out = [];
        for (const eqKey of ['machine', 'dumbbell', 'cable', 'barbell']) {
          if (lib[eqKey] && lib[eqKey].length > 0) {
            out.push({ equipment: eqKey, ...lib[eqKey][0] });
          }
        }
        return out;
      }

      function getYouTubeEmbedUrl(url) {
        if (!url) return null;
        try {
          const u = new URL(url.trim());
          if (u.hostname.includes('youtu.be')) {
            const id = u.pathname.replace('/', '').trim();
            return id ? `https://www.youtube.com/embed/${id}` : null;
          }
          if (u.hostname.includes('youtube.com')) {
            if (u.pathname.startsWith('/shorts/')) {
              const id = u.pathname.split('/')[2];
              return id ? `https://www.youtube.com/embed/${id}` : null;
            }
            const id = u.searchParams.get('v');
            return id ? `https://www.youtube.com/embed/${id}` : null;
          }
        } catch (e) {}
        return null;
      }

              { id: 'ex_calf_raise', name: 'بطات واقف (Standing Calf Raise)', machine: 'Calf Raise Machine', muscle: 'legs', sets: 4, repRange: '12-15', tips: 'توقف ثانيتين بالأسفل لتمدد كامل.' }
            ]

      function getTodayDayId() {
        const jsDay = new Date().getDay();
        const found = DAYS_ORDER.find(d => d.jsDay === jsDay);
        return found ? found.id : 'sat';
      }

      function isoDaysAgo(days) {
        const d = new Date();
        d.setDate(d.getDate() - days);
        return d.toISOString().slice(0, 10);
      }

      function createFreshState() {
        return {
          version: '2.2',
          setupCompleted: false,
          selectedSplit: 'ppl',
          preferredCardio: 'treadmill',
          settings: {
            theme: 'dark',
            defaultRestSec: 90,
            autoStartTimer: true,
            soundEnabled: true
          },
          schedule: buildScheduleFromTemplate('ppl', 'treadmill'),
          history: [],
          drafts: {}
        };
      }

      let state = loadState();
      let currentTab = state.setupCompleted ? 'schedule' : 'onboarding';
      let selectedDayId = getTodayDayId();
      let selectedProgressExId = '';
      let progressViewMode = 'overview';
      let weightChartInstance = null;
      let volumeChartInstance = null;

      // Onboarding local selection before confirming
      let pendingSplitId = state.selectedSplit || 'ppl';
      let pendingCardioId = state.preferredCardio || 'treadmill';

      // Timer state
      let timerTotalSec = state.settings.defaultRestSec || 90;
      let timerRemainingSec = timerTotalSec;
      let timerRunning = false;
      let timerIntervalId = null;
      let timerLabel = 'مؤقت الراحة الذكي (Rest Timer)';

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.schedule) && parsed.schedule.length === 7) {
              if (!parsed.settings) parsed.settings = { theme: 'dark', defaultRestSec: 90, autoStartTimer: true, soundEnabled: true };
              if (!parsed.settings.theme) parsed.settings.theme = 'dark';
              if (!Array.isArray(parsed.history)) parsed.history = [];
              if (!parsed.drafts) parsed.drafts = {};
              parsed.schedule.forEach(d => {
                if (!Array.isArray(d.warmups)) d.warmups = [];
                if (!Array.isArray(d.exercises)) d.exercises = [];
              });
              return parsed;
            }
          }
        } catch (e) {}
        return createFreshState();
      }

      const IDB_NAME = 'IronLabGymDB';
      const IDB_STORE = 'stateStore';
      let lastSavedAt = null;
      let idbActive = false;
      let persistentStorageGranted = false;

      function openIDB() {
        return new Promise((resolve, reject) => {
          try {
            if (!window.indexedDB) return reject(new Error('no-idb'));
            const req = window.indexedDB.open(IDB_NAME, 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains(IDB_STORE)) {
                db.createObjectStore(IDB_STORE);
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          } catch (err) {
            reject(err);
          }
        });
      }

      function saveToIDB(payload) {
        openIDB().then(db => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(payload, STORAGE_KEY);
          tx.oncomplete = () => { idbActive = true; };
        }).catch(() => {});
      }

      function restoreFromIDBIfNeeded() {
        let hasLocal = false;
        try { hasLocal = !!localStorage.getItem(STORAGE_KEY); } catch (e) {}
        openIDB().then(db => {
          idbActive = true;
          if (hasLocal) return;
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(STORAGE_KEY);
          req.onsuccess = () => {
            const recovered = req.result;
            if (recovered && Array.isArray(recovered.schedule) && recovered.schedule.length === 7) {
              state = recovered;
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
              applyTheme();
              switchTab(state.setupCompleted ? 'schedule' : 'onboarding');
              showToast('تم استرجاع بياناتك المحفوظة من ذاكرة الجهاز تلقائياً', 'success');
            }
          };
        }).catch(() => {});
      }

      function requestPersistentStorage() {
        try {
          if (navigator.storage && typeof navigator.storage.persist === 'function') {
            navigator.storage.persist().then(granted => {
              persistentStorageGranted = !!granted;
            }).catch(() => {});
          }
        } catch (e) {}
      }

      function saveState() {
        lastSavedAt = new Date();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
        saveToIDB(state);
      }

      // Flush state automatically when user locks phone, switches apps, or closes tab
      window.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') saveState();
      });
      window.addEventListener('pagehide', () => saveState());
      window.addEventListener('beforeunload', () => saveState());

      // ---- Theme Management (Dark / Light Mode) ----
      function applyTheme() {
        const isDark = state.settings.theme !== 'light';
        document.documentElement.classList.toggle('dark', isDark);
        const metaTheme = document.getElementById('meta-theme-color');
        if (metaTheme) metaTheme.setAttribute('content', isDark ? '#090B10' : '#FFFFFF');

        const iconWrap = document.getElementById('theme-icon-wrap');
        const label = document.getElementById('theme-label');
        if (iconWrap) {
          iconWrap.innerHTML = isDark
            ? '<i data-lucide="sun" class="w-4 h-4 text-amber-400"></i>'
            : '<i data-lucide="moon" class="w-4 h-4 text-indigo-600"></i>';
        }
        if (label) {
          label.textContent = isDark ? 'نهاري' : 'ليلي';

        refreshIcons();

        if (currentTab === 'progress') {
          renderProgressView();

      }

      document.getElementById('btn-theme-toggle').addEventListener('click', () => {
        state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light';
        saveState();
        applyTheme();
        showToast(state.settings.theme === 'light' ? 'تم التبديل للوضع النهاري الأبيض ☀️' : 'تم التبديل للوضع الليلي الداكن 🌙', 'info');
      });

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDateAr(isoStr) {
        try {
          const d = new Date(isoStr + (isoStr.length === 10 ? 'T12:00:00' : ''));
          return d.toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' });
        } catch (e) {
          return isoStr;
        }
      }

      function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const styles = {
          success: 'bg-emerald-600 dark:bg-emerald-950/95 border-emerald-400/60 text-white dark:text-emerald-100',
          pr:      'bg-amber-500 dark:bg-amber-950/95 border-amber-300 text-slate-950 dark:text-amber-100',
          error:   'bg-rose-600 dark:bg-rose-950/95 border-rose-400/60 text-white dark:text-rose-100',
          info:    'bg-slate-900 border-sky-500/40 text-white'
        };
        const icons = { success: 'check-circle-2', pr: 'trophy', error: 'alert-circle', info: 'info' };
        toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl border shadow-xl backdrop-blur-md text-sm font-bold animate-slide-up ${styles[type] || styles.info}`;
        toast.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0"></i><span class="leading-snug">${escapeHtml(message)}</span>`;
        container.appendChild(toast);
        refreshIcons();
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-8px)';
          toast.style.transition = 'all 0.25s ease';
          setTimeout(() => toast.remove(), 260);
        }, type === 'pr' ? 4200 : 2800);
      }

      function refreshIcons() {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }

      function playTimerChime() {
        if (!state.settings.soundEnabled) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const now = ctx.currentTime;
          [880, 1174.66].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.18);
            gain.gain.setValueAtTime(0.001, now + idx * 0.18);
            gain.gain.exponentialRampToValueAtTime(0.22, now + idx * 0.18 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.18 + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.18);
            osc.stop(now + idx * 0.18 + 0.24);
          });
        } catch (e) {}
        try { if (navigator.vibrate) navigator.vibrate([180, 90, 220]); } catch (e) {}
      }

      function celebratePR(exName, newWeight) {
        showToast(`🏆 رقم قياسي جديد (PR)! ${exName} — ${newWeight} كجم`, 'pr');
        if (typeof window.confetti === 'function') {

      }

      // ---- Analytics Helpers ----
      function getExerciseHistory(exerciseId) {
        const records = [];
        const sorted = [...state.history].sort((a, b) => a.date.localeCompare(b.date));
        for (const sess of sorted) {
          const entry = (sess.entries || []).find(e => e.exerciseId === exerciseId);
          if (entry && entry.sets && entry.sets.length > 0) {
            let maxW = 0, vol = 0, bestSet = null;
            for (const s of entry.sets) {
              const w = Number(s.w) || 0;
              const r = Number(s.r) || 0;
              vol += w * r;
              if (w > maxW || (w === maxW && (!bestSet || r > bestSet.r))) {
                maxW = w;
                bestSet = { w, r };
              }
            }
            records.push({ date: sess.date, maxWeight: maxW, volume: Math.round(vol), sets: entry.sets, bestSet });
          }
        }
        return records;
      }

      function getExercisePR(exerciseId) {
        const hist = getExerciseHistory(exerciseId);
        let maxW = 0, maxVol = 0;
        for (const h of hist) {
          if (h.maxWeight > maxW) maxW = h.maxWeight;
          if (h.volume > maxVol) maxVol = h.volume;
        }
        return { maxWeight: maxW, maxVolume: maxVol };
      }

      function getLastSessionForExercise(exerciseId) {
        const hist = getExerciseHistory(exerciseId);
        return hist.length > 0 ? hist[hist.length - 1] : null;
      }

      function getAllUniqueExercises() {
        const map = new Map();
        for (const day of state.schedule) {
          for (const ex of day.exercises || []) {
            if (!map.has(ex.id)) map.set(ex.id, { id: ex.id, name: ex.name, muscle: ex.muscle, machine: ex.machine });
          }
        }
        for (const sess of state.history) {
          for (const entry of sess.entries || []) {
            if (!map.has(entry.exerciseId)) map.set(entry.exerciseId, { id: entry.exerciseId, name: entry.name, muscle: entry.muscle || 'chest', machine: '' });
          }
        }
        return Array.from(map.values());
      }

      function isDayCompletedThisWeek(dayId) {
        const cutoff = isoDaysAgo(6);
        return state.history.some(s => s.dayId === dayId && s.date >= cutoff);
      }

      function ensureDayDraft(dayObj) {
        if (!state.drafts[dayObj.dayId]) {
          state.drafts[dayObj.dayId] = { warmupsDone: {} };
        }
        const dayDraft = state.drafts[dayObj.dayId];
        if (!dayDraft.warmupsDone) dayDraft.warmupsDone = {};

        for (const ex of dayObj.exercises) {
          if (!dayDraft[ex.id] || !Array.isArray(dayDraft[ex.id].sets)) {
            const last = getLastSessionForExercise(ex.id);
            const targetSets = Math.max(1, Number(ex.sets) || 3);
            const defaultReps = parseInt(String(ex.repRange || '10').split('-')[0], 10) || 10;
            const setsArr = [];
            for (let i = 0; i < targetSets; i++) {
              const prevSet = last && last.sets[i] ? last.sets[i] : (last && last.sets[0] ? last.sets[0] : null);
              setsArr.push({
                w: prevSet ? prevSet.w : '',
                r: prevSet ? prevSet.r : defaultReps,
                done: false,
                isPR: false
              });
            }
            dayDraft[ex.id] = { sets: setsArr };
          }
        }
        return dayDraft;
      }

        const completedThisWeek = workoutDays.filter(d => isDayCompletedThisWeek(d.dayId)).length;

              </div>
              <div class="text-center border-x border-slate-200 dark:border-borderDark/80">

                <div class="text-lg font-black text-slate-900 dark:text-white tabular-nums">${Math.round(liveTotalVolume).toLocaleString('en-US')} <span class="text-xs font-normal text-slate-400">كجم</span></div>

              <div class="text-center">
                <div class="text-[11px] text-slate-500 dark:text-slate-400">أرقام قياسية اليوم</div>

              </div>
            </div>
          </div>

          <!-- Warm-up Section (Before Lifting) -->
          ${warmupsHtml}

          <!-- Main Weightlifting Section Header -->
          <div class="flex items-center justify-between mb-3">

              <i data-lucide="dumbbell" class="w-5 h-5 text-emerald-500"></i>
              <span>ثانياً: تمارين الحديد والمقاومة</span>
            </h3>
          </div>

          <div class="space-y-4 mb-6">${exercisesHtml}</div>

          ${dayObj.exercises.length > 0 ? `

              <div>
                <div class="text-sm font-extrabold text-slate-900 dark:text-white">أنهيت تمرينك اليوم؟</div>
                <div class="text-xs text-slate-500 dark:text-slate-400">احفظ الجلسة في السجل لحساب التطور وتحديث الرسوم البيانية.</div>
              </div>
              <div class="flex items-center gap-2 w-full sm:w-auto">
                <button id="btn-reset-draft" class="px-3.5 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 transition">تصفير الجولات</button>
                <button id="btn-finish-session" class="flex-1 sm:flex-none px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white dark:text-slate-950 font-black text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/25 active:scale-95 transition">
                  <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                  <span>إنهاء وحفظ الجلسة</span>
                </button>
              </div>
            </div>
          ` : ''}
        `;

        bindWorkoutDayPills(container);

        // Warm-up Handlers
        const btnAddWu = document.getElementById('btn-add-warmup');
        if (btnAddWu) btnAddWu.addEventListener('click', () => openWarmupModal(dayObj.dayId));

        container.querySelectorAll('[data-toggle-warmup]').forEach(btn => {
          btn.addEventListener('click', () => {
            const wId = btn.dataset.toggleWarmup;
            dayDraft.warmupsDone[wId] = !dayDraft.warmupsDone[wId];
            saveState();
            renderWorkoutView();
          });
        });

        container.querySelectorAll('[data-start-wu-timer]').forEach(btn => {
          btn.addEventListener('click', () => {
            const mins = Math.max(1, Number(btn.dataset.startWuTimer) || 5);
            const wuName = btn.dataset.wuName || 'الإحماء';
            startRestTimer(mins * 60, `مؤقت الإحماء: ${wuName}`);
          });
        });

        container.querySelectorAll('[data-delete-warmup]').forEach(btn => {
          btn.addEventListener('click', () => {
            const wId = btn.dataset.deleteWarmup;
            dayObj.warmups = dayObj.warmups.filter(w => w.id !== wId);
            delete dayDraft.warmupsDone[wId];
            saveState();
            renderWorkoutView();
            showToast('تم حذف فقرة الإحماء', 'info');
          });
        });

        // Day & Exercise Handlers
        const btnOlympia = document.getElementById('btn-toggle-olympia');
        if (btnOlympia) btnOlympia.addEventListener('click', openOlympiaTipsModal);

        const btnEditDay = document.getElementById('btn-edit-this-day');
        if (btnEditDay) btnEditDay.addEventListener('click', () => openEditDayModal(dayObj.dayId));

        const btnAddEx = document.getElementById('btn-add-exercise');
        if (btnAddEx) btnAddEx.addEventListener('click', () => openExerciseModal(dayObj.dayId, null));

        const btnEmptyAdd = document.getElementById('btn-empty-add-ex');
        if (btnEmptyAdd) btnEmptyAdd.addEventListener('click', () => openExerciseModal(dayObj.dayId, null));

        container.querySelectorAll('[data-set-input]').forEach(inp => {
          inp.addEventListener('input', () => {
            const field = inp.dataset.setInput;
            const exId = inp.dataset.exId;
            const sIdx = Number(inp.dataset.setIdx);
            const val = inp.value === '' ? '' : Number(inp.value);
            if (state.drafts[dayObj.dayId] && state.drafts[dayObj.dayId][exId]) {
              state.drafts[dayObj.dayId][exId].sets[sIdx][field] = val;
              saveState();
            }
          });
        });

        container.querySelectorAll('[data-toggle-set]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exId = btn.dataset.toggleSet;
            const sIdx = Number(btn.dataset.setIdx);
            const exObj = dayObj.exercises.find(e => e.id === exId);
            const setObj = state.drafts[dayObj.dayId][exId].sets[sIdx];

            if (!setObj.done) {
              const w = Number(setObj.w) || 0;
              const r = Number(setObj.r) || 0;
              if (r <= 0) {
                showToast('أدخل عدد التكرارات أولاً لإتمام الجولة', 'error');
                return;
              }
              setObj.done = true;

              const prevPR = getExercisePR(exId).maxWeight;
              const otherTodayMax = state.drafts[dayObj.dayId][exId].sets
                .filter((_, idx) => idx !== sIdx && _.done)
                .reduce((m, s) => Math.max(m, Number(s.w) || 0), 0);

              if (w > 0 && prevPR > 0 && w > Math.max(prevPR, otherTodayMax)) {
                setObj.isPR = true;
                celebratePR(exObj ? exObj.name : '', w);
              } else {
                setObj.isPR = false;
              }

              if (state.settings.autoStartTimer) {
                startRestTimer(state.settings.defaultRestSec || 90, 'مؤقت الراحة الذكي (Rest Timer)');
              }
            } else {
              setObj.done = false;
              setObj.isPR = false;
            }
            saveState();
            renderWorkoutView();
          });
        });

        container.querySelectorAll('[data-add-set]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exId = btn.dataset.addSet;
            const setsArr = state.drafts[dayObj.dayId][exId].sets;
            const last = setsArr[setsArr.length - 1] || { w: '', r: 10 };
            setsArr.push({ w: last.w, r: last.r, done: false, isPR: false });
            saveState();
            renderWorkoutView();
          });
        });

        container.querySelectorAll('[data-remove-set]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exId = btn.dataset.removeSet;
            const setsArr = state.drafts[dayObj.dayId][exId].sets;
            if (setsArr.length > 1) {
              setsArr.pop();
              saveState();
              renderWorkoutView();
            }
          });
        });

        container.querySelectorAll('[data-swap-ex]').forEach(btn => {
          btn.addEventListener('click', () => {
            openSwapExerciseModal(dayObj.dayId, btn.dataset.swapEx);
          });
        });

        container.querySelectorAll('[data-toggle-variants]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exId = btn.dataset.toggleVariants;
            openVariantExId = (openVariantExId === exId) ? null : exId;
            renderWorkoutView();
          });
        });

        container.querySelectorAll('[data-apply-variant]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exId = btn.dataset.applyVariant;
            const vIdx = Number(btn.dataset.variantIdx);
            const exObj = dayObj.exercises.find(e => e.id === exId);
            if (!exObj) return;
            const variants = getVariantsForExercise(exObj);
            const chosen = variants[vIdx];
            if (!chosen) return;
            exObj.name = chosen.name;
            exObj.machine = chosen.machine;
            exObj.equipment = chosen.equipment;
            exObj.tips = chosen.tips;
            openVariantExId = null;
            saveState();
            renderWorkoutView();
            const eqLabel = (EQUIPMENT_META[chosen.equipment] && EQUIPMENT_META[chosen.equipment].label) || '';
            showToast(`تم التبديل إلى: ${eqLabel} — ${chosen.name}`, 'success');
          });
        });

        container.querySelectorAll('[data-watch-video]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exObj = dayObj.exercises.find(e => e.id === btn.dataset.watchVideo);
            if (exObj) openVideoModal(dayObj.dayId, exObj);
          });
        });

        container.querySelectorAll('[data-add-video]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exObj = dayObj.exercises.find(e => e.id === btn.dataset.addVideo);
            if (exObj) openQuickVideoEditModal(dayObj.dayId, exObj);
          });
        });

        container.querySelectorAll('[data-edit-ex]').forEach(btn => {
          btn.addEventListener('click', () => openExerciseModal(dayObj.dayId, btn.dataset.editEx));
        });

        container.querySelectorAll('[data-delete-ex]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exId = btn.dataset.deleteEx;
            const exObj = dayObj.exercises.find(e => e.id === exId);
            openConfirmModal(
              'حذف التمرين',
              `هل تريد حذف تمرين "${exObj ? exObj.name : ''}" من هذا اليوم؟`,
              () => {
                dayObj.exercises = dayObj.exercises.filter(e => e.id !== exId);
                if (state.drafts[dayObj.dayId]) delete state.drafts[dayObj.dayId][exId];
                saveState();
                renderWorkoutView();
                showToast('تم حذف التمرين من اليوم', 'info');
              }
            );
          });
        });

        container.querySelectorAll('[data-move-ex]').forEach(btn => {
          btn.addEventListener('click', () => {
            const dir = btn.dataset.moveEx;
            const idx = Number(btn.dataset.exIdx);
            const target = dir === 'up' ? idx - 1 : idx + 1;
            if (target >= 0 && target < dayObj.exercises.length) {
              const tmp = dayObj.exercises[idx];
              dayObj.exercises[idx] = dayObj.exercises[target];
              dayObj.exercises[target] = tmp;
              saveState();
              renderWorkoutView();
            }
          });
        });

        const btnReset = document.getElementById('btn-reset-draft');
        if (btnReset) {
          btnReset.addEventListener('click', () => {
            openConfirmModal('تصفير الجولات الحالية', 'سيتم إلغاء تحديد جميع فقرات الإحماء والجولات المنجزة في هذه الجلسة الحالية.', () => {
              delete state.drafts[dayObj.dayId];
              saveState();
              renderWorkoutView();
              showToast('تم تصفير جولات اليوم', 'info');
            });
          });
        }

        const btnFinish = document.getElementById('btn-finish-session');
        if (btnFinish) {
          btnFinish.addEventListener('click', () => finishWorkoutSession(dayObj));
        }

        refreshIcons();
      }

      function bindWorkoutDayPills(container) {
        container.querySelectorAll('[data-select-day]').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedDayId = btn.dataset.selectDay;
            renderWorkoutView();
          });
        });
      }

      function finishWorkoutSession(dayObj) {
        const dayDraft = state.drafts[dayObj.dayId] || {};
        const entries = [];
        let totalVolume = 0;
        let prsCount = 0;

        for (const ex of dayObj.exercises) {
          const dEx = dayDraft[ex.id];
          if (!dEx || !Array.isArray(dEx.sets)) continue;
          const completedSets = dEx.sets
            .filter(s => s.done && (Number(s.r) || 0) > 0)
            .map(s => ({ w: Number(s.w) || 0, r: Number(s.r) || 0 }));

          if (completedSets.length > 0) {
            const prevPR = getExercisePR(ex.id).maxWeight;
            const sessionMax = Math.max(...completedSets.map(s => s.w));
            if (prevPR > 0 && sessionMax > prevPR) prsCount++;
            for (const s of completedSets) totalVolume += s.w * s.r;
            entries.push({ exerciseId: ex.id, name: ex.name, muscle: ex.muscle, sets: completedSets });
          }
        }

        if (entries.length === 0) {
          showToast('أكمل جولة واحدة على الأقل (✓) قبل حفظ الجلسة', 'error');
          return;
        }

        const warmupsCompleted = (dayObj.warmups || [])
          .filter(w => dayDraft.warmupsDone && dayDraft.warmupsDone[w.id])
          .map(w => w.name);

        const newSession = {
          id: 'sess_' + Date.now(),
          date: new Date().toISOString().slice(0, 10),
          dayId: dayObj.dayId,
          dayTitle: dayObj.title,
          totalVolume: Math.round(totalVolume),
          prsCount,
          warmupsCompleted,
          entries
        };

        state.history.push(newSession);
        delete state.drafts[dayObj.dayId];
        saveState();

        showToast(`تم حفظ الجلسة! إجمالي الحجم: ${newSession.totalVolume.toLocaleString('en-US')} كجم`, 'success');
        if (prsCount > 0 && typeof window.confetti === 'function') {
          try { window.confetti({ particleCount: 90, spread: 75, origin: { y: 0.65 } }); } catch (e) {}
        }
        selectedProgressExId = entries[0].exerciseId;
        switchTab('progress');
      }

      // =========================================================
      // VIEW 3: PROGRESS TRACKER & ANALYTICS (OVERVIEW + DETAILED)

      function renderProgressView() {
        const container = document.getElementById('view-progress');

            <!-- Personal Records Wall -->
            <section class="app-card rounded-2xl border p-4 sm:p-5">
              <div class="flex items-center justify-between gap-2 mb-4 flex-wrap">

          </section>

          ${hist.length > 0 ? `

              لا توجد جلسات مسجلة لهذا التمرين بعد. ابدأ تمرينك الأول من تبويب "التمرين" ليظهر الرسم البياني تلقائياً.

      function bindProgressControls(container) {
        container.querySelectorAll('[data-progress-mode]').forEach(btn => {
          btn.addEventListener('click', () => {
            progressViewMode = btn.dataset.progressMode;
            renderProgressView();
          });

        const sel = document.getElementById('progress-ex-select');
        if (sel) {
          sel.addEventListener('change', () => {
            selectedProgressExId = sel.value;
            renderProgressView();
          });

      function downloadFile(filename, content, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function exportJSON() {
        const dateTag = new Date().toISOString().slice(0, 10);
        downloadFile(`ironlab_gym_backup_${dateTag}.json`, JSON.stringify(state, null, 2), 'application/json');
        showToast('تم تصدير النسخة الاحتياطية (JSON)', 'success');
      }

      function exportCSV() {
        const rows = [['التاريخ', 'اليوم', 'التمرين', 'العضلة', 'الجولة', 'الوزن (كجم)', 'التكرارات', 'الحجم (كجم)']];
        for (const sess of state.history) {
          for (const entry of sess.entries || []) {
            const mm = MUSCLE_META[entry.muscle] ? MUSCLE_META[entry.muscle].label : entry.muscle;
            (entry.sets || []).forEach((s, idx) => {
              rows.push([
                sess.date,
                `"${String(sess.dayTitle || '').replace(/"/g, '""')}"`,
                `"${String(entry.name || '').replace(/"/g, '""')}"`,
                mm,
                idx + 1,
                s.w,
                s.r,
                Math.round((Number(s.w) || 0) * (Number(s.r) || 0))
              ]);
            });
          }
        }
        const csvStr = '\uFEFF' + rows.map(r => r.join(',')).join('\n');
        const dateTag = new Date().toISOString().slice(0, 10);
        downloadFile(`ironlab_gym_log_${dateTag}.csv`, csvStr, 'text/csv;charset=utf-8;');
        showToast('تم تصدير سجل الأوزان (CSV)', 'success');
      }

      document.getElementById('json-import-input').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = JSON.parse(reader.result);
            if (!imported || !Array.isArray(imported.schedule) || imported.schedule.length !== 7) {
              showToast('ملف النسخة الاحتياطية غير صالح', 'error');
              return;
            }
            state = imported;
            if (!state.settings) state.settings = { theme: 'dark', defaultRestSec: 90, autoStartTimer: true, soundEnabled: true };
            if (!Array.isArray(state.history)) state.history = [];
            if (!state.drafts) state.drafts = {};
            state.schedule.forEach(d => { if (!Array.isArray(d.warmups)) d.warmups = []; });
            state.setupCompleted = true;
            saveState();
            applyTheme();
            showToast('تم استيراد النسخة الاحتياطية بنجاح!', 'success');
            switchTab('schedule');
          } catch (err) {
            showToast('تعذّر قراءة ملف JSON', 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

      function openSwapExerciseModal(dayId, exerciseId) {
        const dayObj = state.schedule.find(d => d.dayId === dayId);
        if (!dayObj) return;
        const exIdx = dayObj.exercises.findIndex(e => e.id === exerciseId);
        if (exIdx === -1) return;
        const currentEx = dayObj.exercises[exIdx];
        const mm = MUSCLE_META[currentEx.muscle] || MUSCLE_META.chest;

        let activeSwapTab = 'muscle'; // 'muscle' | 'schedule' | 'custom'
        let eqFilter = 'all';

        function applySwap(newData) {
          const oldId = currentEx.id;
          const nextId = newData.id || ('ex_' + Date.now());
          dayObj.exercises[exIdx] = {
            id: nextId,
            name: newData.name,
            machine: newData.machine || '',
            muscle: newData.muscle || currentEx.muscle,
            equipment: newData.equipment || inferEquipment(newData),
            sets: currentEx.sets,
            repRange: currentEx.repRange,
            tips: newData.tips || '',
            videoUrl: newData.videoUrl || ''
          };
          if (state.drafts[dayId] && state.drafts[dayId][oldId]) {
            delete state.drafts[dayId][oldId];
          }
          openVariantExId = null;
          saveState();
          closeModal();
          renderWorkoutView();
          showToast(`تم استبدال التمرين إلى: ${newData.name}`, 'success');
        }

        function renderSwapBody() {
          // 1. Gather all library exercises for the same muscle
          const libForMuscle = EXERCISE_LIBRARY[currentEx.muscle] || {};
          const muscleChoices = [];
          for (const [eqKey, list] of Object.entries(libForMuscle)) {
            for (const item of list) {
              if (item.name === currentEx.name) continue;
              if (eqFilter !== 'all' && eqFilter !== eqKey) continue;
              muscleChoices.push({ ...item, equipment: eqKey, muscle: currentEx.muscle });
            }
          }

          // 2. Gather exercises from all days in the user's current schedule
          const scheduleChoices = [];
          const seenNames = new Set([currentEx.name]);
          for (const d of state.schedule) {
            const dMeta = DAYS_ORDER.find(x => x.id === d.dayId);
            for (const ex of d.exercises || []) {
              if (seenNames.has(ex.name)) continue;
              seenNames.add(ex.name);
              scheduleChoices.push({ ...ex, fromDayAr: dMeta ? dMeta.ar : d.dayId });
            }
          }

          let tabContentHtml = '';

          if (activeSwapTab === 'muscle') {

                ${muscleChoices.length === 0 ? '<div class="text-xs text-slate-400 text-center py-6">لا توجد بدائل إضافية بهذا الفلتر — جرّب فلتر "الكل" أو تبويب "من عندي".</div>' : muscleChoices.map((item, idx) => {
                  const eqM = EQUIPMENT_META[item.equipment] || EQUIPMENT_META.machine;
                  return `
                    <button type="button" data-pick-muscle-swap="${idx}" class="app-subtle w-full text-right p-3 rounded-xl border hover:border-emerald-500 flex items-center justify-between gap-2 transition active:scale-[0.99]">

                        <div class="flex items-center gap-1.5 mb-0.5">

                        <div class="text-xs font-extrabold text-slate-900 dark:text-white truncate">${escapeHtml(item.name)}</div>
                        <div class="text-[11px] text-slate-500 dark:text-slate-400 truncate">${escapeHtml(item.machine)}</div>
                      </div>
                      <span class="px-2.5 py-1.5 rounded-lg bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 text-[11px] font-black shrink-0">استبدال</span>
                    </button>
                  `;
                }).join('')}
              </div>
            `;

            tabContentHtml = `

                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5 flex-wrap mb-0.5">
                          <span class="px-1.5 py-0.5 rounded text-[10px] font-bold border ${im.bg} ${im.text} ${im.border}">${im.label}</span>
                          <span class="px-1.5 py-0.5 rounded text-[10px] font-bold border ${eqM.cls}">${eqM.short}</span>
                          <span class="text-[10px] font-bold text-slate-400">من يوم ${item.fromDayAr}</span>
                        </div>
                        <div class="text-xs font-extrabold text-slate-900 dark:text-white truncate">${escapeHtml(item.name)}</div>
                        ${item.machine ? `<div class="text-[11px] text-slate-500 dark:text-slate-400 truncate">${escapeHtml(item.machine)}</div>` : ''}
                      </div>
                      <span class="px-2.5 py-1.5 rounded-lg bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 text-[11px] font-black shrink-0">اختيار</span>
                    </button>
                  `;
                }).join('')}
              </div>
            `;
          } else {
            tabContentHtml = `
              <form id="form-custom-swap" class="space-y-3">
                <div>
                  <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">اسم التمرين البديل *</label>
                  <input id="swap-custom-name" type="text" required placeholder="اكتب اسم التمرين الذي تريده..." class="app-input w-full h-11 px-3.5 rounded-xl border focus:border-emerald-500 text-sm font-bold outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">اسم الجهاز / المعدة (اختياري)</label>
                  <input id="swap-custom-machine" type="text" placeholder="مثلاً: دمبل، جهاز سميث، كيبل..." class="app-input w-full h-11 px-3.5 rounded-xl border focus:border-emerald-500 text-sm outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">نوع الجهاز</label>
                  <div class="grid grid-cols-3 gap-1.5">
                    ${Object.entries(EQUIPMENT_META).map(([k, eq]) => `
                      <label class="cursor-pointer">
                        <input type="radio" name="swapCustomEq" value="${k}" ${k === inferEquipment(currentEx) ? 'checked' : ''} class="peer sr-only" />
                        <div class="app-subtle py-2 px-2 rounded-xl border text-center text-[11px] font-bold text-slate-600 dark:text-slate-300 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/15 peer-checked:text-emerald-700 dark:peer-checked:text-emerald-300 transition">${eq.short}</div>
                      </label>
                    `).join('')}
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">ملاحظة أداء (اختياري)</label>
                  <input id="swap-custom-tips" type="text" placeholder="أي ملاحظة تهمك للتمرين البديل..." class="app-input w-full h-10 px-3 rounded-xl border focus:border-emerald-500 text-xs outline-none" />
                </div>
                <div class="flex justify-end gap-2 pt-1">
                  <button type="button" id="btn-cancel-swap" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300">إلغاء</button>
                  <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white dark:text-slate-950 text-xs font-black">اعتماد التمرين البديل</button>
                </div>
              </form>
            `;
          }

          openModal('استبدال التمرين', `
            <div class="space-y-4">
              <!-- Current Exercise Pill -->
              <div class="app-subtle rounded-xl border p-3 flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="text-[10px] font-bold text-slate-400">التمرين الحالي:</div>
                  <div class="text-xs font-extrabold text-slate-900 dark:text-white truncate">${escapeHtml(currentEx.name)}</div>
                </div>
                <span class="px-2 py-0.5 rounded-md text-[11px] font-bold border shrink-0 ${mm.bg} ${mm.text} ${mm.border}">${mm.label}</span>
              </div>

              <!-- 3 Cohesive Swap Mode Tabs -->
              <div class="grid grid-cols-3 gap-1 app-subtle border p-1 rounded-xl">
                <button type="button" data-swap-tab="muscle" class="py-2 px-2 rounded-lg text-[11px] font-extrabold transition ${activeSwapTab === 'muscle' ? 'bg-emerald-500 text-white dark:text-slate-950 shadow-sm' : 'text-slate-600 dark:text-slate-300'}">نفس العضلة (${mm.label})</button>
                <button type="button" data-swap-tab="schedule" class="py-2 px-2 rounded-lg text-[11px] font-extrabold transition ${activeSwapTab === 'schedule' ? 'bg-emerald-500 text-white dark:text-slate-950 shadow-sm' : 'text-slate-600 dark:text-slate-300'}">من جدولك</button>
                <button type="button" data-swap-tab="custom" class="py-2 px-2 rounded-lg text-[11px] font-extrabold transition ${activeSwapTab === 'custom' ? 'bg-emerald-500 text-white dark:text-slate-950 shadow-sm' : 'text-slate-600 dark:text-slate-300'}">تمرين من عندي</button>
              </div>

              <!-- Active Tab Content -->
              <div>${tabContentHtml}</div>
            </div>
          `);

          modalBody.querySelectorAll('[data-swap-tab]').forEach(b => {
            b.addEventListener('click', () => {
              activeSwapTab = b.dataset.swapTab;
              renderSwapBody();
            });
          });

          modalBody.querySelectorAll('[data-eq-filter]').forEach(b => {
            b.addEventListener('click', () => {
              eqFilter = b.dataset.eqFilter;
              renderSwapBody();
            });
          });

          modalBody.querySelectorAll('[data-pick-muscle-swap]').forEach(b => {
            b.addEventListener('click', () => {
              const item = muscleChoices[Number(b.dataset.pickMuscleSwap)];
              if (item) applySwap(item);
            });
          });

          modalBody.querySelectorAll('[data-pick-sched-swap]').forEach(b => {
            b.addEventListener('click', () => {
              const item = scheduleChoices[Number(b.dataset.pickSchedSwap)];
              if (item) applySwap(item);
            });
          });

          const cancelSwap = document.getElementById('btn-cancel-swap');
          if (cancelSwap) cancelSwap.addEventListener('click', closeModal);

          const customForm = document.getElementById('form-custom-swap');
          if (customForm) {
            customForm.addEventListener('submit', (e) => {
              e.preventDefault();
              const name = document.getElementById('swap-custom-name').value.trim();
              if (!name) return;
              const machine = document.getElementById('swap-custom-machine').value.trim();
              const eqRadio = document.querySelector('input[name="swapCustomEq"]:checked');
              const equipment = eqRadio ? eqRadio.value : 'machine';
              const tips = document.getElementById('swap-custom-tips').value.trim();
              applySwap({ name, machine, equipment, muscle: currentEx.muscle, tips });
            });
          }
        }

        renderSwapBody();
      }

      function openOlympiaTipsModal() {
        openModal('نصائح معتمدة للمبتدئين من أبطال مستر أولمبيا', `
          <div class="space-y-3">
            ${OLYMPIA_TIPS.map(tip => `
              <div class="app-subtle rounded-2xl border p-4 flex items-start gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/15 border border-emerald-500/25 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0">
                  <i data-lucide="${tip.icon}" class="w-5 h-5"></i>
                </div>
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap mb-1">
                    <span class="text-xs font-black text-slate-900 dark:text-white">${tip.champion}</span>
                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-500/15 text-amber-700 dark:text-amber-300">${tip.title}</span>
                  </div>
                  <div class="text-xs font-extrabold text-emerald-700 dark:text-emerald-400 mb-1">${tip.rule}</div>
                  <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">${tip.desc}</p>
                </div>
              </div>
            `).join('')}
          </div>
        `);
      }

      function openQuickVideoEditModal(dayId, exObj) {
        openModal('إضافة رابط فيديو شرح للتمرين', `
          <form id="form-quick-video" class="space-y-4">
            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">الصق رابط مقطع الشرح من <strong>تيك توك (TikTok)</strong> أو <strong>يوتيوب (YouTube)</strong> أو <strong>إنستغرام</strong> لتمرين <strong class="text-slate-900 dark:text-white">${escapeHtml(exObj.name)}</strong>:</p>
            <input id="quick-video-url" type="url" dir="ltr" required value="${escapeHtml(exObj.videoUrl || '')}" placeholder="https://www.tiktok.com/... أو https://youtu.be/..." class="app-input w-full h-11 px-3.5 rounded-xl border focus:border-rose-500 text-xs outline-none text-left" />
            <div class="flex items-center justify-end gap-2">
              ${exObj.videoUrl ? '<button type="button" id="btn-remove-video" class="px-3.5 py-2.5 rounded-xl bg-rose-500/10 text-rose-500 text-xs font-bold">حذف الرابط</button>' : ''}
              <button type="button" id="btn-cancel-qvid" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300">إلغاء</button>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-rose-500 hover:bg-rose-400 text-white text-xs font-black">حفظ الفيديو</button>
            </div>
          </form>
        `);
        document.getElementById('btn-cancel-qvid').addEventListener('click', closeModal);
        const remBtn = document.getElementById('btn-remove-video');
        if (remBtn) {
          remBtn.addEventListener('click', () => {
            exObj.videoUrl = '';
            saveState();
            closeModal();
            renderWorkoutView();
            showToast('تم حذف رابط الفيديو', 'info');
          });
        }
        document.getElementById('form-quick-video').addEventListener('submit', (e) => {
          e.preventDefault();
          exObj.videoUrl = document.getElementById('quick-video-url').value.trim();
          saveState();
          closeModal();
          renderWorkoutView();
          showToast('تم حفظ رابط فيديو الشرح بنجاح!', 'success');
        });
      }

      function openVideoModal(dayId, exObj) {
        const url = exObj.videoUrl || '';
        const ytEmbed = getYouTubeEmbedUrl(url);
        const isTikTok = url.toLowerCase().includes('tiktok.com');
        const platformLabel = ytEmbed ? 'يوتيوب (YouTube)' : isTikTok ? 'تيك توك (TikTok)' : 'فيديو الشرح';

        openModal(`شرح: ${exObj.name}`, `
          <div class="space-y-4">
            ${ytEmbed ? `
              <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-black border border-slate-700">
                <iframe src="${escapeHtml(ytEmbed)}" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
              </div>
            ` : `
              <div class="app-subtle rounded-2xl border p-6 text-center">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-rose-500/15 text-rose-500 flex items-center justify-center mb-3">
                  <i data-lucide="play-circle" class="w-8 h-8"></i>
                </div>
                <div class="text-sm font-extrabold text-slate-900 dark:text-white mb-1">مقطع شرح محفوظ من ${platformLabel}</div>
                <p class="text-xs text-slate-500 dark:text-slate-400 break-all mb-4" dir="ltr">${escapeHtml(url)}</p>
                <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-rose-500 hover:bg-rose-400 text-white text-xs font-black shadow-lg shadow-rose-500/20 transition">
                  <i data-lucide="external-link" class="w-4 h-4"></i>
                  <span>فتح المقطع الآن</span>
                </a>
              </div>
            `}
            <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-200 dark:border-borderDark">
              <button id="btn-edit-video-link" class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300">تعديل / حذف الرابط</button>
              <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-xl bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 text-xs font-extrabold inline-flex items-center gap-1.5">
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                <span>فتح في تطبيق مستقل</span>
              </a>
            </div>
          </div>
        `);

        document.getElementById('btn-edit-video-link').addEventListener('click', () => {
          openQuickVideoEditModal(dayId, exObj);
        });
      }

      // =========================================================
      // SMART REST / WARM-UP TIMER
      // =========================================================
      const timerDrawer = document.getElementById('rest-timer-drawer');
      const timerDisplay = document.getElementById('timer-display');
      const timerTitleEl = document.getElementById('timer-title-label');
      const timerBar = document.getElementById('timer-progress-bar');
      const timerPlayPause = document.getElementById('timer-play-pause');
      const headerTimerText = document.getElementById('header-timer-text');
      const timerAutoCheckbox = document.getElementById('timer-auto-checkbox');
      const timerSoundToggle = document.getElementById('timer-sound-toggle');

      function formatMMSS(sec) {
        const s = Math.max(0, Math.floor(sec));
        const m = Math.floor(s / 60);
        const rem = s % 60;
        return String(m).padStart(2, '0') + ':' + String(rem).padStart(2, '0');
      }

      function updateTimerUI() {
        const formatted = formatMMSS(timerRemainingSec);
        timerDisplay.textContent = formatted;
        timerTitleEl.textContent = timerLabel;
        headerTimerText.textContent = timerRunning ? formatted : 'مؤقت';
        const pct = timerTotalSec > 0 ? Math.max(0, Math.min(100, (timerRemainingSec / timerTotalSec) * 100)) : 0;
        timerBar.style.width = pct + '%';

        timerPlayPause.innerHTML = timerRunning
          ? '<i data-lucide="pause" class="w-3.5 h-3.5"></i><span>إيقاف</span>'
          : '<i data-lucide="play" class="w-3.5 h-3.5"></i><span>تشغيل</span>';

        timerAutoCheckbox.checked = !!state.settings.autoStartTimer;
        timerSoundToggle.innerHTML = state.settings.soundEnabled
          ? '<i data-lucide="volume-2" class="w-4 h-4 text-sky-500"></i>'
          : '<i data-lucide="volume-x" class="w-4 h-4 text-slate-400"></i>';

        document.querySelectorAll('.timer-preset-btn').forEach(btn => {
          const val = Number(btn.dataset.preset);
          btn.className = val === timerTotalSec
            ? 'timer-preset-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-sky-500 text-white dark:text-slate-950 tabular-nums transition'
            : 'timer-preset-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 tabular-nums transition';
        });

        refreshIcons();
      }

      function stopTimerInterval() {
        if (timerIntervalId !== null) {
          clearInterval(timerIntervalId);
          timerIntervalId = null;
        }
        timerRunning = false;
      }

      function startRestTimer(seconds, customLabel) {
        stopTimerInterval();
        if (customLabel) timerLabel = customLabel;
        if (typeof seconds === 'number' && seconds > 0) {
          timerTotalSec = seconds;
          timerRemainingSec = seconds;
        } else if (timerRemainingSec <= 0) {
          timerRemainingSec = timerTotalSec;
        }
        timerDrawer.classList.remove('hidden');
        timerRunning = true;
        updateTimerUI();

        timerIntervalId = setInterval(() => {
          timerRemainingSec--;
          if (timerRemainingSec <= 0) {
            timerRemainingSec = 0;
            stopTimerInterval();
            updateTimerUI();
            playTimerChime();
            showToast('⏰ انتهى المؤقت! استعد للخطوة التالية', 'info');
          } else {
            updateTimerUI();
          }
        }, 1000);
      }

      document.getElementById('btn-open-timer').addEventListener('click', () => {
        if (timerDrawer.classList.contains('hidden')) {
          timerDrawer.classList.remove('hidden');
          if (!timerRunning && timerRemainingSec <= 0) {
            timerRemainingSec = state.settings.defaultRestSec || 90;
            timerTotalSec = timerRemainingSec;
          }
          updateTimerUI();
        } else {
          timerDrawer.classList.add('hidden');
        }
      });

      document.getElementById('timer-close-btn').addEventListener('click', () => {
        stopTimerInterval();
        timerDrawer.classList.add('hidden');
        updateTimerUI();
      });

      timerPlayPause.addEventListener('click', () => {
        if (timerRunning) { stopTimerInterval(); updateTimerUI(); }
        else startRestTimer();
      });

      document.getElementById('timer-minus-15').addEventListener('click', () => {
        timerRemainingSec = Math.max(5, timerRemainingSec - 15);
        updateTimerUI();
      });

      document.getElementById('timer-plus-15').addEventListener('click', () => {
        timerRemainingSec += 15;
        if (timerRemainingSec > timerTotalSec) timerTotalSec = timerRemainingSec;
        updateTimerUI();
      });

      document.querySelectorAll('.timer-preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const sec = Number(btn.dataset.preset) || 90;
          state.settings.defaultRestSec = sec;
          saveState();
          startRestTimer(sec, 'مؤقت الراحة الذكي (Rest Timer)');
        });
      });

      timerAutoCheckbox.addEventListener('change', () => {
        state.settings.autoStartTimer = timerAutoCheckbox.checked;
        saveState();
      });

      timerSoundToggle.addEventListener('click', () => {
        state.settings.soundEnabled = !state.settings.soundEnabled;
        saveState();
        updateTimerUI();
      });

      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.nav));
      });

      function initApp() {
        try {
          const nowStr = new Date().toLocaleDateString('ar-SA', { weekday: 'long', day: 'numeric', month: 'long' });
          document.getElementById('header-date-label').textContent = nowStr;
        } catch (e) {
          document.getElementById('header-date-label').textContent = 'متتبع التمارين الذكي';
        }
        requestPersistentStorage();
        restoreFromIDBIfNeeded();
        applyTheme();
        updateTimerUI();
        switchTab(state.setupCompleted ? 'schedule' : 'onboarding');
      }

      initApp();
    })();
  </script>
</body>
</html>
