  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --bg-app: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --bg-input: #FFFFFF;
      --border-main: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --glass-header: rgba(255, 255, 255, 0.90);
      --glass-nav: rgba(255, 255, 255, 0.95);
    }

    html.dark {
      color-scheme: dark;
      --bg-app: #090B10;
      --bg-card: #121620;
      --bg-subtle: #0D111A;
      --bg-input: #0F172A;
      --border-main: #1F2738;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --glass-header: rgba(9, 11, 16, 0.86);
      --glass-nav: rgba(12, 16, 24, 0.95);
    }

    html:not(.dark) {
      color-scheme: light;
    }

    html, body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: 'Tajawal', 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      min-height: 100dvh;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-card {
      background-color: var(--bg-card);
      border-color: var(--border-main);
    }

    .app-subtle {
      background-color: var(--bg-subtle);
      border-color: var(--border-main);
    }

    .app-input {
      background-color: var(--bg-input);
      border-color: var(--border-main);
      color: var(--text-main);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-family: 'Inter', 'Tajawal', sans-serif;
    }

    .glass-header {
      background: var(--glass-header);
      border-color: var(--border-main);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding-top: var(--safe-top);
    }

    .bottom-nav {
      background: var(--glass-nav);
      border-color: var(--border-main);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding-bottom: calc(var(--safe-bottom) + 0.35rem);
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #64748B55; border-radius: 999px; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.30); }
      50% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
    }
    .pulse-today { animation: pulseGlow 2.4s infinite; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.24s ease-out forwards; }

    /* 2D Anatomical Technique Animations */
    .tech-stage { --tech-dur: 2.8s; }
    .tech-stage.slow-mo { --tech-dur: 5.2s; }
    .tech-stage.paused * { animation-play-state: paused !important; }

    @keyframes musclePulse {
      0%, 100% { fill: url(#muscleOrange); opacity: 0.72; filter: drop-shadow(0 0 4px rgba(255,107,43,0.45)); }
      50% { fill: url(#muscleOrangeHot); opacity: 1; filter: drop-shadow(0 0 11px rgba(255,107,43,0.95)); }
    }
    .muscle-glow { animation: musclePulse var(--tech-dur) ease-in-out infinite; }
    .laser-good { stroke: #22C55E; filter: drop-shadow(0 0 6px rgba(34,197,94,0.9)); }
    .laser-bad  { stroke: #EF4444; filter: drop-shadow(0 0 6px rgba(239,68,68,0.9)); }

    @keyframes chestPushY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-28px); }
    }
    .anim-chest-push { animation: chestPushY var(--tech-dur) ease-in-out infinite; }

    @keyframes latPullY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(34px); }
    }
    .anim-lat-pull { animation: latPullY var(--tech-dur) ease-in-out infinite; }

    @keyframes rowPullX {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(26px); }
    }
    .anim-row-pull { animation: rowPullX var(--tech-dur) ease-in-out infinite; }

    @keyframes latRaiseL {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(78deg); }
    }
    @keyframes latRaiseR {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-78deg); }
    }
    .anim-raise-l { transform-origin: 86px 76px; animation: latRaiseL var(--tech-dur) ease-in-out infinite; }
    .anim-raise-r { transform-origin: 154px 76px; animation: latRaiseR var(--tech-dur) ease-in-out infinite; }

    @keyframes shoulderPushY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-34px); }
    }
    .anim-shoulder-push { animation: shoulderPushY var(--tech-dur) ease-in-out infinite; }

    @keyframes curlFlex {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-108deg); }
    }
    .anim-bicep-curl { transform-origin: 122px 118px; animation: curlFlex var(--tech-dur) ease-in-out infinite; }

    @keyframes triPush {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(85deg); }
    }
    .anim-tri-push { transform-origin: 120px 104px; animation: triPush var(--tech-dur) ease-in-out infinite; }

    @keyframes squatMove {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(32px); }
    }
    .anim-squat { animation: squatMove var(--tech-dur) ease-in-out infinite; }

    @keyframes crunchBend {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(36deg); }
    }
    .anim-crunch { transform-origin: 120px 136px; animation: crunchBend var(--tech-dur) ease-in-out infinite; }
  </style>
</head>

      function getVariantsForExercise(ex) {
        const hay = ((ex.name || '') + ' ' + (ex.machine || '')).toLowerCase();
        for (const grp of EXERCISE_VARIANT_GROUPS) {
          if (grp.match.some(k => hay.includes(k))) {
            return grp.variants;
          }
        }
        // Fallback: collect up to 3–4 equipment options for this exercise's muscle
        const lib = EXERCISE_LIBRARY[ex.muscle] || EXERCISE_LIBRARY.chest;
        const out = [];
        for (const eqKey of ['machine', 'dumbbell', 'cable', 'barbell']) {
          if (lib[eqKey] && lib[eqKey].length > 0) {
            out.push({ equipment: eqKey, ...lib[eqKey][0] });
          }
        }
        return out;
      }

      function getYouTubeEmbedUrl(url) {
        if (!url) return null;
        try {
          const u = new URL(url.trim());
          if (u.hostname.includes('youtu.be')) {
            const id = u.pathname.replace('/', '').trim();
            return id ? `https://www.youtube.com/embed/${id}` : null;
          }
          if (u.hostname.includes('youtube.com')) {
            if (u.pathname.startsWith('/shorts/')) {
              const id = u.pathname.split('/')[2];
              return id ? `https://www.youtube.com/embed/${id}` : null;
            }
            const id = u.searchParams.get('v');
            return id ? `https://www.youtube.com/embed/${id}` : null;
          }
        } catch (e) {}
        return null;
      }

      function isoDaysAgo(days) {
        const d = new Date();
        d.setDate(d.getDate() - days);
        return d.toISOString().slice(0, 10);
      }

        return {

          settings: {
            theme: 'dark',

          },

          history: [],

        };

      let state = loadState();

      let pendingSplitId = state.selectedSplit || 'ppl';

      let timerTotalSec = state.settings.defaultRestSec || 90;

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.schedule) && parsed.schedule.length === 7) {
              if (!parsed.settings) parsed.settings = { theme: 'dark', defaultRestSec: 90, autoStartTimer: true, soundEnabled: true };
              if (!parsed.settings.theme) parsed.settings.theme = 'dark';
              if (!Array.isArray(parsed.history)) parsed.history = [];
              if (!parsed.drafts) parsed.drafts = {};
              parsed.schedule.forEach(d => {
                if (!Array.isArray(d.warmups)) d.warmups = [];
                if (!Array.isArray(d.exercises)) d.exercises = [];
              });
              return parsed;
            }
          }
        } catch (e) {}
        return createFreshState();
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      // ---- Theme Management (Dark / Light Mode) ----
      function applyTheme() {
        const isDark = state.settings.theme !== 'light';
        document.documentElement.classList.toggle('dark', isDark);
        const metaTheme = document.getElementById('meta-theme-color');
        if (metaTheme) metaTheme.setAttribute('content', isDark ? '#090B10' : '#FFFFFF');

        const iconWrap = document.getElementById('theme-icon-wrap');
        const label = document.getElementById('theme-label');
        if (iconWrap) {
          iconWrap.innerHTML = isDark
            ? '<i data-lucide="sun" class="w-4 h-4 text-amber-400"></i>'
            : '<i data-lucide="moon" class="w-4 h-4 text-indigo-600"></i>';
        }
        if (label) {
          label.textContent = isDark ? 'نهاري' : 'ليلي';
        }
        refreshIcons();

        if (currentTab === 'progress') {
          renderProgressView();
        }
      }

      document.getElementById('btn-theme-toggle').addEventListener('click', () => {
        state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light';
        saveState();
        applyTheme();
        showToast(state.settings.theme === 'light' ? 'تم التبديل للوضع النهاري الأبيض ☀️' : 'تم التبديل للوضع الليلي الداكن 🌙', 'info');
      });

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDateAr(isoStr) {
        try {
          const d = new Date(isoStr + (isoStr.length === 10 ? 'T12:00:00' : ''));
          return d.toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' });
        } catch (e) {
          return isoStr;
        }
      }

      function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const styles = {
          success: 'bg-emerald-600 dark:bg-emerald-950/95 border-emerald-400/60 text-white dark:text-emerald-100',
          pr:      'bg-amber-500 dark:bg-amber-950/95 border-amber-300 text-slate-950 dark:text-amber-100',
          error:   'bg-rose-600 dark:bg-rose-950/95 border-rose-400/60 text-white dark:text-rose-100',
          info:    'bg-slate-900 border-sky-500/40 text-white'
        };
        const icons = { success: 'check-circle-2', pr: 'trophy', error: 'alert-circle', info: 'info' };
        toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl border shadow-xl backdrop-blur-md text-sm font-bold animate-slide-up ${styles[type] || styles.info}`;
        toast.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0"></i><span class="leading-snug">${escapeHtml(message)}</span>`;
        container.appendChild(toast);
        refreshIcons();
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-8px)';
          toast.style.transition = 'all 0.25s ease';
          setTimeout(() => toast.remove(), 260);
        }, type === 'pr' ? 4200 : 2800);
      }

      function refreshIcons() {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }

      function playTimerChime() {
        if (!state.settings.soundEnabled) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const now = ctx.currentTime;
          [880, 1174.66].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.18);
            gain.gain.setValueAtTime(0.001, now + idx * 0.18);
            gain.gain.exponentialRampToValueAtTime(0.22, now + idx * 0.18 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.18 + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.18);
            osc.stop(now + idx * 0.18 + 0.24);
          });
        } catch (e) {}
        try { if (navigator.vibrate) navigator.vibrate([180, 90, 220]); } catch (e) {}
      }

      function celebratePR(exName, newWeight) {
        showToast(`🏆 رقم قياسي جديد (PR)! ${exName} — ${newWeight} كجم`, 'pr');
        if (typeof window.confetti === 'function') {
          try {
            window.confetti({ particleCount: 70, spread: 65, origin: { y: 0.7 }, colors: ['#F59E0B', '#10B981', '#38BDF8', '#FFFFFF'] });
          } catch (e) {}
        }
      }

      // ---- Analytics Helpers ----
      function getExerciseHistory(exerciseId) {
        const records = [];
        const sorted = [...state.history].sort((a, b) => a.date.localeCompare(b.date));
        for (const sess of sorted) {
          const entry = (sess.entries || []).find(e => e.exerciseId === exerciseId);
          if (entry && entry.sets && entry.sets.length > 0) {
            let maxW = 0, vol = 0, bestSet = null;
            for (const s of entry.sets) {
              const w = Number(s.w) || 0;
              const r = Number(s.r) || 0;
              vol += w * r;
              if (w > maxW || (w === maxW && (!bestSet || r > bestSet.r))) {
                maxW = w;
                bestSet = { w, r };
              }
            }
            records.push({ date: sess.date, maxWeight: maxW, volume: Math.round(vol), sets: entry.sets, bestSet });
          }
        }
        return records;
      }

      function getExercisePR(exerciseId) {
        const hist = getExerciseHistory(exerciseId);
        let maxW = 0, maxVol = 0;
        for (const h of hist) {
          if (h.maxWeight > maxW) maxW = h.maxWeight;
          if (h.volume > maxVol) maxVol = h.volume;
        }
        return { maxWeight: maxW, maxVolume: maxVol };
      }

      function getLastSessionForExercise(exerciseId) {
        const hist = getExerciseHistory(exerciseId);
        return hist.length > 0 ? hist[hist.length - 1] : null;
      }

      function getAllUniqueExercises() {
        const map = new Map();
        for (const day of state.schedule) {
          for (const ex of day.exercises || []) {
            if (!map.has(ex.id)) map.set(ex.id, { id: ex.id, name: ex.name, muscle: ex.muscle, machine: ex.machine });
          }
        }
        for (const sess of state.history) {
          for (const entry of sess.entries || []) {
            if (!map.has(entry.exerciseId)) map.set(entry.exerciseId, { id: entry.exerciseId, name: entry.name, muscle: entry.muscle || 'chest', machine: '' });
          }
        }
        return Array.from(map.values());
      }

      function isDayCompletedThisWeek(dayId) {
        const cutoff = isoDaysAgo(6);
        return state.history.some(s => s.dayId === dayId && s.date >= cutoff);
      }

      function ensureDayDraft(dayObj) {
        if (!state.drafts[dayObj.dayId]) {
          state.drafts[dayObj.dayId] = { warmupsDone: {} };
        }
        const dayDraft = state.drafts[dayObj.dayId];
        if (!dayDraft.warmupsDone) dayDraft.warmupsDone = {};

        for (const ex of dayObj.exercises) {
          if (!dayDraft[ex.id] || !Array.isArray(dayDraft[ex.id].sets)) {
            const last = getLastSessionForExercise(ex.id);
            const targetSets = Math.max(1, Number(ex.sets) || 3);
            const defaultReps = parseInt(String(ex.repRange || '10').split('-')[0], 10) || 10;
            const setsArr = [];
            for (let i = 0; i < targetSets; i++) {
              const prevSet = last && last.sets[i] ? last.sets[i] : (last && last.sets[0] ? last.sets[0] : null);
              setsArr.push({
                w: prevSet ? prevSet.w : '',
                r: prevSet ? prevSet.r : defaultReps,
                done: false,
                isPR: false
              });
            }
            dayDraft[ex.id] = { sets: setsArr };
          }
        }
        return dayDraft;
      }

      function finishWorkoutSession(dayObj) {
        const dayDraft = state.drafts[dayObj.dayId] || {};
        const entries = [];
        let totalVolume = 0;
        let prsCount = 0;

        for (const ex of dayObj.exercises) {
          const dEx = dayDraft[ex.id];
          if (!dEx || !Array.isArray(dEx.sets)) continue;
          const completedSets = dEx.sets
            .filter(s => s.done && (Number(s.r) || 0) > 0)
            .map(s => ({ w: Number(s.w) || 0, r: Number(s.r) || 0 }));

          if (completedSets.length > 0) {
            const prevPR = getExercisePR(ex.id).maxWeight;
            const sessionMax = Math.max(...completedSets.map(s => s.w));
            if (prevPR > 0 && sessionMax > prevPR) prsCount++;
            for (const s of completedSets) totalVolume += s.w * s.r;
            entries.push({ exerciseId: ex.id, name: ex.name, muscle: ex.muscle, sets: completedSets });
          }
        }

        if (entries.length === 0) {
          showToast('أكمل جولة واحدة على الأقل (✓) قبل حفظ الجلسة', 'error');
          return;
        }

        const warmupsCompleted = (dayObj.warmups || [])
          .filter(w => dayDraft.warmupsDone && dayDraft.warmupsDone[w.id])
          .map(w => w.name);

        const newSession = {
          id: 'sess_' + Date.now(),
          date: new Date().toISOString().slice(0, 10),
          dayId: dayObj.dayId,
          dayTitle: dayObj.title,
          totalVolume: Math.round(totalVolume),
          prsCount,
          warmupsCompleted,
          entries
        };

        state.history.push(newSession);
        delete state.drafts[dayObj.dayId];
        saveState();

        showToast(`تم حفظ الجلسة! إجمالي الحجم: ${newSession.totalVolume.toLocaleString('en-US')} كجم`, 'success');
        if (prsCount > 0 && typeof window.confetti === 'function') {
          try { window.confetti({ particleCount: 90, spread: 75, origin: { y: 0.65 } }); } catch (e) {}
        }
        selectedProgressExId = entries[0].exerciseId;
        switchTab('progress');
      }

      // =========================================================

      function renderProgressView() {

            const pr = h.length ? Math.max(...h.map(x => x.maxWeight)) : 0;
            const growth = (h.length >= 2 && h[0].maxWeight > 0)
              ? Math.round(((h[h.length - 1].maxWeight - h[0].maxWeight) / h[0].maxWeight) * 100)
              : null;
            return { ...e, pr, sessions: h.length, growth };
          })
          .filter(e => e.pr > 0)
          .sort((a, b) => b.pr - a.pr);

        // Top Mode Switcher (Matches exact app pill navigation style)

              <h2 class="text-xl font-black text-slate-900 dark:text-white flex items-center gap-2">

            </div>
            <div class="inline-flex items-center gap-1 app-card border p-1 rounded-xl self-start sm:self-auto">
              <button data-progress-mode="overview" class="px-4 py-2 rounded-lg text-xs font-extrabold transition flex items-center gap-1.5 ${
                progressViewMode === 'overview'
                  ? 'bg-emerald-500 text-white dark:text-slate-950 shadow-sm'

              }">
                <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i>

              </button>

                <span>تفصيلي</span>
              </button>
            </div>

        `;

        // ---- OVERVIEW MODE (Default) ----
        if (progressViewMode === 'overview') {
          const totalSessions = sortedHistory.length;
          const totalVolumeAll = sortedHistory.reduce((s, x) => s + (Number(x.totalVolume) || 0), 0);
          const totalPRs = sortedHistory.reduce((s, x) => s + (Number(x.prsCount) || 0), 0);
          const avgVol = totalSessions > 0 ? Math.round(totalVolumeAll / totalSessions) : 0;

          // Overall Growth % comparing first session volume vs latest session volume
          let overallMsg = 'سجّل أول جلسة تمرين لك من تبويب "التمرين" ليبدأ تتبع تطورك العام تلقائياً.';
          if (totalSessions === 1) {
            overallMsg = `انطلاقة رائعة! أنهيت أول جلسة بحجم تدريبي ${totalVolumeAll.toLocaleString('en-US')} كجم. استمر في التسجيل لمتابعة منحنى التطور.`;
          } else if (totalSessions >= 2) {
            const firstV = Number(sortedHistory[0].totalVolume) || 0;
            const lastV = Number(sortedHistory[sortedHistory.length - 1].totalVolume) || 0;
            const diffPct = firstV > 0 ? Math.round(((lastV - firstV) / firstV) * 100) : 0;
            overallMsg = diffPct > 0
              ? `أداء ممتاز! ارتفع إجمالي جهدك في الجلسة بنسبة +${diffPct}% مقارنة بأول جلسة مسجلة لك.`
              : `مستوى التزام ثابت عبر ${totalSessions} جلسات بإجمالي حجم تدريبي ${totalVolumeAll.toLocaleString('en-US')} كجم.`;
          }

          // Muscle distribution counts across logged sets
          const muscleCounts = { chest: 0, back: 0, shoulders: 0, legs: 0, arms: 0, abs: 0 };
          let maxMuscleSets = 1;
          for (const sess of sortedHistory) {
            for (const entry of sess.entries || []) {
              const mk = MUSCLE_META[entry.muscle] ? entry.muscle : 'chest';
              muscleCounts[mk] += (entry.sets || []).length;
              if (muscleCounts[mk] > maxMuscleSets) maxMuscleSets = muscleCounts[mk];
            }
          }

          container.innerHTML = `

            <section class="app-card rounded-3xl border p-5 mb-5">

                </div>
                <div class="app-subtle rounded-2xl border p-3">

                  <div class="text-xl font-black text-emerald-600 dark:text-emerald-400 tabular-nums">${totalVolumeAll.toLocaleString('en-US')}</div>
                </div>
                <div class="app-subtle rounded-2xl border p-3">
                  <div class="text-[11px] text-slate-500 dark:text-slate-400 mb-1">متوسط حجم الجلسة</div>
                  <div class="text-xl font-black text-sky-600 dark:text-sky-400 tabular-nums">${avgVol.toLocaleString('en-US')}</div>
                </div>
                <div class="app-subtle rounded-2xl border p-3">
                  <div class="text-[11px] text-slate-500 dark:text-slate-400 mb-1">أرقام قياسية PR</div>
                  <div class="text-xl font-black text-amber-500 dark:text-amber-400 tabular-nums">${totalPRs} 🏆</div>
                </div>
              </div>
            </section>

            <!-- Overall Trend & Muscle Focus -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-5">

                </div>
                ${totalSessions > 0 ? '<div class="relative h-64"><canvas id="chart-overall-volume"></canvas></div>' : `
                  <div class="h-64 flex flex-col items-center justify-center text-center text-xs text-slate-500 dark:text-slate-400 px-4">
                    <i data-lucide="bar-chart-3" class="w-8 h-8 text-slate-400 mb-2"></i>
                    <span>سيظهر منحنى تطورك العام هنا تلقائياً بعد حفظ أول جلسة تمرين.</span>
                  </div>
                `}
              </div>

              <div class="app-card rounded-2xl border p-4">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">توزيع التمرين على العضلات (الجولات المسجلة)</h3>
                  <span class="text-[11px] text-sky-600 dark:text-sky-400 font-bold">Balance</span>
                </div>
                <div class="space-y-3 pt-1">
                  ${Object.entries(MUSCLE_META).map(([key, mm]) => {
                    const cnt = muscleCounts[key] || 0;
                    const barW = totalSessions > 0 ? Math.round((cnt / maxMuscleSets) * 100) : 0;
                    return `
                      <div>
                        <div class="flex items-center justify-between text-xs font-bold mb-1">
                          <span class="text-slate-700 dark:text-slate-200">${mm.label} (${mm.en})</span>
                          <span class="text-slate-500 dark:text-slate-400 tabular-nums">${cnt} جولة</span>

                        <div class="w-full h-2.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                          <div class="h-full rounded-full transition-all duration-500" style="width:${barW}%; background:${mm.dot}"></div>

                  }).join('')}
                </div>
              </div>
            </div>

            <!-- Personal Records Wall -->
            <section class="app-card rounded-2xl border p-4 sm:p-5">
              <div class="flex items-center justify-between gap-2 mb-4 flex-wrap">
                <h3 class="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                  <i data-lucide="trophy" class="w-5 h-5 text-amber-500"></i>
                  <span>أفضل أرقامك القياسية (PRs)</span>
                </h3>
                <button data-progress-mode="detailed" class="text-xs font-extrabold text-emerald-600 dark:text-emerald-400 hover:underline">عرض التحليل التفصيلي ←</button>
              </div>
              ${prList.length === 0 ? '<p class="text-xs text-slate-500 dark:text-slate-400">ستظهر أرقامك القياسية هنا فور حفظ أول جلسة تمرين.</p>' : `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  ${prList.map(item => {
                    const im = MUSCLE_META[item.muscle] || MUSCLE_META.chest;
                    return `
                      <button data-pick-pr="${item.id}" class="app-subtle text-right p-3.5 rounded-xl border hover:border-amber-500/50 flex items-center justify-between gap-3 transition">
                        <div class="min-w-0">
                          <div class="flex items-center gap-1.5 mb-1">
                            <span class="w-2 h-2 rounded-full shrink-0" style="background:${im.dot}"></span>
                            <span class="text-xs font-extrabold text-slate-900 dark:text-white truncate">${escapeHtml(item.name)}</span>
                          </div>
                          <div class="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">${item.sessions} جلسات ${item.growth !== null ? `• التطور: <span class="${item.growth >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'} font-bold">${item.growth > 0 ? '+' : ''}${item.growth}%</span>` : ''}</div>
                        </div>
                        <div class="px-3 py-1.5 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-700 dark:text-amber-300 font-black text-sm tabular-nums shrink-0">${item.pr} كجم</div>
                      </button>
                    `;
                  }).join('')}
                </div>
              `}
            </section>
          `;

          bindProgressControls(container);
          refreshIcons();
          if (totalSessions > 0 && window.Chart) renderOverallVolumeChart(sortedHistory);
          return;
        }

        // ---- DETAILED MODE ----
        if (allExercises.length === 0) {
          container.innerHTML = `${modeHeaderHtml}<div class="app-card rounded-3xl border p-10 text-center text-slate-500 dark:text-slate-400">أضف تمارين وسجل أول جلسة لك لبدء عرض التحليل التفصيلي.</div>`;
          bindProgressControls(container);
          refreshIcons();
          return;
        }

        if (!allExercises.some(e => e.id === selectedProgressExId)) {
          selectedProgressExId = allExercises[0].id;
        }

        const activeEx = allExercises.find(e => e.id === selectedProgressExId);
        const hist = getExerciseHistory(activeEx.id);
        const mm = MUSCLE_META[activeEx.muscle] || MUSCLE_META.chest;

        let firstMax = 0, latestMax = 0, bestMax = 0, strengthPct = 0;
        let firstVol = 0, latestVol = 0, volPct = 0;
        if (hist.length > 0) {
          firstMax = hist[0].maxWeight;
          latestMax = hist[hist.length - 1].maxWeight;
          bestMax = Math.max(...hist.map(h => h.maxWeight));
          if (firstMax > 0) strengthPct = Math.round(((latestMax - firstMax) / firstMax) * 100);
          firstVol = hist[0].volume;
          latestVol = hist[hist.length - 1].volume;
          if (firstVol > 0) volPct = Math.round(((latestVol - firstVol) / firstVol) * 100);
        }

        let motivationMsg = 'سجّل أول جلسة لهذا التمرين ليبدأ حساب تطورك التفصيلي تلقائياً.';
        if (hist.length === 1) {
          motivationMsg = `بداية رائعة! سجلت ${latestMax} كجم في أول جلسة — عند تسجيل الجلسة الثانية سيظهر منحنى التطور ونسبة الزيادة.`;
        } else if (hist.length >= 2) {
          if (strengthPct > 0) motivationMsg = `ممتاز! تطورت قوتك بنسبة +${strengthPct}% في تمرين "${activeEx.name}" (من ${firstMax} كجم إلى ${latestMax} كجم).`;
          else if (volPct > 0) motivationMsg = `تقدم رائع في الحجم التدريبي بنسبة +${volPct}%! حتى مع ثبات الوزن، جهدك العضلي ارتفع بوضوح.`;
          else motivationMsg = `ثبات جيد عند ${latestMax} كجم — جرّب زيادة +2.5 كجم أو تكرار إضافي في الجلسة القادمة.`;
        }

        container.innerHTML = `
          ${modeHeaderHtml}

          <section class="app-card rounded-3xl border p-5 mb-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
              <div class="text-sm font-extrabold text-slate-900 dark:text-white">اختر التمرين للتحليل التفصيلي:</div>
              <select id="progress-ex-select" class="app-input w-full sm:w-80 h-11 px-3 rounded-xl border focus:border-emerald-500 text-sm font-bold outline-none">
                ${allExercises.map(e => `<option value="${e.id}" ${e.id === activeEx.id ? 'selected' : ''}>${escapeHtml(e.name)}</option>`).join('')}
              </select>
            </div>

            <div class="rounded-2xl bg-emerald-500/10 border border-emerald-500/30 p-3.5 flex items-start gap-3 mb-4">
              <div class="w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 flex items-center justify-center shrink-0">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
              </div>
              <div>
                <div class="flex items-center gap-2 flex-wrap mb-0.5">
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-bold border ${mm.bg} ${mm.text} ${mm.border}">${mm.label}</span>
                  <span class="text-xs font-extrabold text-emerald-700 dark:text-emerald-300">تحليل التمرين التفصيلي</span>
                </div>
                <p class="text-sm font-bold text-slate-900 dark:text-white leading-snug">${escapeHtml(motivationMsg)}</p>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
              <div class="app-subtle rounded-2xl border p-3">
                <div class="text-[11px] text-slate-500 dark:text-slate-400 mb-1">أعلى وزن (PR)</div>
                <div class="text-xl font-black text-amber-500 dark:text-amber-400 tabular-nums">${bestMax} <span class="text-xs font-normal text-slate-400">كجم</span></div>
              </div>
              <div class="app-subtle rounded-2xl border p-3">
                <div class="text-[11px] text-slate-500 dark:text-slate-400 mb-1">تطور القوة</div>
                <div class="text-xl font-black tabular-nums ${strengthPct >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'}">${strengthPct > 0 ? '+' : ''}${strengthPct}%</div>
              </div>
              <div class="app-subtle rounded-2xl border p-3">
                <div class="text-[11px] text-slate-500 dark:text-slate-400 mb-1">آخر حجم تدريبي</div>
                <div class="text-xl font-black text-sky-600 dark:text-sky-400 tabular-nums">${latestVol.toLocaleString('en-US')} <span class="text-xs font-normal text-slate-400">كجم</span></div>
              </div>
              <div class="app-subtle rounded-2xl border p-3">
                <div class="text-[11px] text-slate-500 dark:text-slate-400 mb-1">عدد الجلسات</div>
                <div class="text-xl font-black text-slate-900 dark:text-white tabular-nums">${hist.length}</div>
              </div>
            </div>
          </section>

          ${hist.length > 0 ? `
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
              <div class="app-card rounded-2xl border p-4">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">منحنى تطور الأوزان (أعلى وزن بالكجم)</h3>
                  <span class="text-[11px] text-emerald-600 dark:text-emerald-400 font-bold">Max Weight</span>
                </div>
                <div class="relative h-64"><canvas id="chart-weight"></canvas></div>
              </div>
              <div class="app-card rounded-2xl border p-4">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">تطور الحجم التدريبي (الوزن × التكرارات)</h3>
                  <span class="text-[11px] text-sky-600 dark:text-sky-400 font-bold">Total Volume</span>
                </div>
                <div class="relative h-64"><canvas id="chart-volume"></canvas></div>
              </div>
            </div>
          ` : `
            <div class="app-card rounded-2xl border p-8 text-center text-sm text-slate-500 dark:text-slate-400 mb-6">
              لا توجد جلسات مسجلة لهذا التمرين بعد. ابدأ تمرينك الأول من تبويب "التمرين" ليظهر الرسم البياني تلقائياً.
            </div>
          `}
        `;

        bindProgressControls(container);
        refreshIcons();
        if (hist.length > 0 && window.Chart) renderProgressCharts(hist);
      }

      function bindProgressControls(container) {
        container.querySelectorAll('[data-progress-mode]').forEach(btn => {
          btn.addEventListener('click', () => {
            progressViewMode = btn.dataset.progressMode;
            renderProgressView();
          });
        });

        const sel = document.getElementById('progress-ex-select');
        if (sel) {
          sel.addEventListener('change', () => {
            selectedProgressExId = sel.value;
            renderProgressView();
          });
        }

        container.querySelectorAll('[data-pick-pr]').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedProgressExId = btn.dataset.pickPr;
            progressViewMode = 'detailed';
            renderProgressView();
          });
        });
      }

      function renderOverallVolumeChart(sortedHistory) {
        if (weightChartInstance) { weightChartInstance.destroy(); weightChartInstance = null; }
        const isDark = state.settings.theme !== 'light';
        const gridColor = isDark ? 'rgba(148, 163, 184, 0.10)' : 'rgba(15, 23, 42, 0.08)';
        const tickColor = isDark ? '#94A3B8' : '#475569';
        const canvas = document.getElementById('chart-overall-volume');
        if (!canvas) return;

        weightChartInstance = new Chart(canvas.getContext('2d'), {
          type: 'line',
          data: {
            labels: sortedHistory.map(s => formatDateAr(s.date)),
            datasets: [{
              label: 'الحجم التدريبي للجلسة (كجم)',
              data: sortedHistory.map(s => Number(s.totalVolume) || 0),
              borderColor: '#10B981',
              backgroundColor: 'rgba(16, 185, 129, 0.16)',
              borderWidth: 3,
              pointBackgroundColor: '#10B981',
              pointBorderColor: isDark ? '#090B10' : '#FFFFFF',
              pointBorderWidth: 2,
              pointRadius: 5,
              fill: true,
              tension: 0.35
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                rtl: true,
                backgroundColor: isDark ? '#0F172A' : '#1E293B',
                titleFont: { family: 'Tajawal', size: 12, weight: 'bold' },
                bodyFont: { family: 'Inter', size: 13, weight: 'bold' }
              }
            },
            scales: {
              x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { family: 'Tajawal', size: 11 } } },
              y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: tickColor, font: { family: 'Inter', size: 11 } } }
            }
          }
        });
      }

      function renderProgressCharts(hist) {
        if (weightChartInstance) { weightChartInstance.destroy(); weightChartInstance = null; }
        if (volumeChartInstance) { volumeChartInstance.destroy(); volumeChartInstance = null; }

        const isDark = state.settings.theme !== 'light';
        const gridColor = isDark ? 'rgba(148, 163, 184, 0.10)' : 'rgba(15, 23, 42, 0.08)';
        const tickColor = isDark ? '#94A3B8' : '#475569';

        const labels = hist.map(h => formatDateAr(h.date));
        const weights = hist.map(h => h.maxWeight);
        const volumes = hist.map(h => h.volume);

        const commonOptions = {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              rtl: true,
              backgroundColor: isDark ? '#0F172A' : '#1E293B',
              titleFont: { family: 'Tajawal', size: 12, weight: 'bold' },
              bodyFont: { family: 'Inter', size: 13, weight: 'bold' }
            }
          },
          scales: {
            x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { family: 'Tajawal', size: 11 } } },
            y: { beginAtZero: false, grid: { color: gridColor }, ticks: { color: tickColor, font: { family: 'Inter', size: 11 } } }
          }
        };

        const wCanvas = document.getElementById('chart-weight');
        if (wCanvas) {
          weightChartInstance = new Chart(wCanvas.getContext('2d'), {
            type: 'line',
            data: {
              labels,
              datasets: [{
                label: 'أعلى وزن (كجم)',
                data: weights,
                borderColor: '#10B981',
                backgroundColor: 'rgba(16, 185, 129, 0.16)',
                borderWidth: 3,
                pointBackgroundColor: '#10B981',
                pointBorderColor: isDark ? '#090B10' : '#FFFFFF',
                pointBorderWidth: 2,
                pointRadius: 5,
                fill: true,
                tension: 0.35
              }]
            },
            options: commonOptions
          });
        }

        const vCanvas = document.getElementById('chart-volume');
        if (vCanvas) {
          volumeChartInstance = new Chart(vCanvas.getContext('2d'), {
            type: 'bar',
            data: {
              labels,
              datasets: [{
                label: 'الحجم التدريبي (كجم)',
                data: volumes,
                backgroundColor: 'rgba(14, 165, 233, 0.72)',
                borderColor: '#0EA5E9',
                borderWidth: 1.5,
                borderRadius: 8
              }]
            },
            options: {
              ...commonOptions,
              scales: { ...commonOptions.scales, y: { ...commonOptions.scales.y, beginAtZero: true } }
            }
          });
        }
      }

      // =========================================================
      // VIEW 4: HISTORY LOG & JSON/CSV BACKUP
      // =========================================================
      function renderDataView() {
        const container = document.getElementById('view-data');
        const sortedHistory = [...state.history].sort((a, b) => b.date.localeCompare(a.date));

        container.innerHTML = `
          <section class="app-card rounded-3xl border p-5 mb-5">
            <h2 class="text-lg font-black text-slate-900 dark:text-white flex items-center gap-2 mb-1">
              <i data-lucide="hard-drive-download" class="w-5 h-5 text-emerald-500"></i>
              <span>النسخ الاحتياطي وإدارة البيانات</span>
            </h2>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">بياناتك محفوظة تلقائياً في جهازك (LocalStorage). يمكنك تصدير نسخة احتياطية أو إعادة اختيار النظام التدريبي في أي وقت.</p>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 mb-4">
              <button id="btn-export-json" class="p-3.5 rounded-2xl bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-500/35 text-emerald-700 dark:text-emerald-300 font-extrabold text-xs flex items-center justify-center gap-2 transition active:scale-95">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>تصدير نسخة كاملة (JSON)</span>
              </button>
              <button id="btn-export-csv" class="p-3.5 rounded-2xl bg-sky-500/15 hover:bg-sky-500/25 border border-sky-500/35 text-sky-700 dark:text-sky-300 font-extrabold text-xs flex items-center justify-center gap-2 transition active:scale-95">
                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                <span>تصدير سجل الأوزان (CSV)</span>
              </button>
              <button id="btn-import-json" class="p-3.5 rounded-2xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-borderDark text-slate-700 dark:text-slate-200 font-extrabold text-xs flex items-center justify-center gap-2 transition active:scale-95">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span>استيراد نسخة (JSON)</span>
              </button>
            </div>

            <div class="flex items-center justify-between gap-2 pt-3 border-t border-slate-200 dark:border-borderDark/70 flex-wrap">
              <div class="flex items-center gap-3">
                <label class="text-xs font-bold text-slate-600 dark:text-slate-300">مدة الراحة الافتراضية:</label>
                <select id="setting-default-rest" class="app-input h-9 px-2.5 rounded-xl border text-xs font-bold tabular-nums">
                  <option value="60" ${state.settings.defaultRestSec === 60 ? 'selected' : ''}>60 ثانية</option>
                  <option value="90" ${state.settings.defaultRestSec === 90 ? 'selected' : ''}>90 ثانية</option>
                  <option value="120" ${state.settings.defaultRestSec === 120 ? 'selected' : ''}>120 ثانية</option>
                  <option value="180" ${state.settings.defaultRestSec === 180 ? 'selected' : ''}>180 ثانية</option>
                </select>
              </div>
              <div class="flex items-center gap-2 flex-wrap">
                <button id="btn-reopen-onboarding" class="px-3 py-2 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-700 dark:text-emerald-300 text-xs font-bold transition">
                  إعادة اختيار النظام التدريبي
                </button>
                <button id="btn-factory-reset" class="px-3 py-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-600 dark:text-rose-300 text-xs font-bold transition">
                  تصفير التطبيق بالكامل
                </button>
              </div>
            </div>
          </section>

          <section class="app-card rounded-3xl border p-5">
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2 mb-4">
              <i data-lucide="history" class="w-5 h-5 text-sky-500"></i>
              <span>سجل الجلسات السابقة (${sortedHistory.length})</span>
            </h3>

            ${sortedHistory.length === 0 ? `
              <div class="text-center py-8 text-sm text-slate-500 dark:text-slate-400">السجل فارغ حالياً — ستظهر جلساتك هنا فور إنهاء أول تمرين.</div>
            ` : `
              <div class="space-y-3">
                ${sortedHistory.map(sess => `
                  <div class="app-subtle rounded-2xl border p-4">
                    <div class="flex items-start justify-between gap-2 mb-3">
                      <div>
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="text-sm font-extrabold text-slate-900 dark:text-white">${escapeHtml(sess.dayTitle)}</span>
                          ${sess.prsCount > 0 ? `<span class="px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-700 dark:text-amber-300 border border-amber-500/30 text-[10px] font-bold">🏆 ${sess.prsCount} PR</span>` : ''}
                          ${sess.warmupsCompleted && sess.warmupsCompleted.length > 0 ? `<span class="px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-700 dark:text-amber-300 text-[10px] font-bold">🔥 ${sess.warmupsCompleted.length} إحماء</span>` : ''}
                        </div>
                        <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 tabular-nums">${formatDateAr(sess.date)} • إجمالي الحجم: <span class="text-sky-600 dark:text-sky-400 font-bold">${(Number(sess.totalVolume) || 0).toLocaleString('en-US')} كجم</span></div>
                      </div>
                      <button data-delete-sess="${sess.id}" title="حذف الجلسة" class="w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 dark:text-rose-400 flex items-center justify-center transition">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                    <div class="space-y-1.5">
                      ${(sess.entries || []).map(e => `
                        <div class="flex items-center justify-between gap-2 text-xs app-card border rounded-xl px-3 py-2">
                          <span class="font-bold text-slate-800 dark:text-slate-200 truncate">${escapeHtml(e.name)}</span>
                          <span class="text-slate-500 dark:text-slate-400 tabular-nums shrink-0">${(e.sets || []).map(s => `${s.w}×${s.r}`).join(' | ')}</span>

                  </div>

              </div>

        document.getElementById('btn-export-json').addEventListener('click', exportJSON);
        document.getElementById('btn-export-csv').addEventListener('click', exportCSV);
        document.getElementById('btn-import-json').addEventListener('click', () => {
          document.getElementById('json-import-input').click();
        });

        document.getElementById('setting-default-rest').addEventListener('change', (e) => {
          state.settings.defaultRestSec = Number(e.target.value) || 90;
          saveState();
          showToast(`تم ضبط الراحة الافتراضية على ${state.settings.defaultRestSec} ثانية`, 'success');
        });

        document.getElementById('btn-reopen-onboarding').addEventListener('click', () => {
          pendingSplitId = state.selectedSplit || 'ppl';
          pendingCardioId = state.preferredCardio || 'treadmill';
          switchTab('onboarding');

      function downloadFile(filename, content, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function exportJSON() {
        const dateTag = new Date().toISOString().slice(0, 10);
        downloadFile(`ironlab_gym_backup_${dateTag}.json`, JSON.stringify(state, null, 2), 'application/json');
        showToast('تم تصدير النسخة الاحتياطية (JSON)', 'success');
      }

      function exportCSV() {
        const rows = [['التاريخ', 'اليوم', 'التمرين', 'العضلة', 'الجولة', 'الوزن (كجم)', 'التكرارات', 'الحجم (كجم)']];
        for (const sess of state.history) {
          for (const entry of sess.entries || []) {
            const mm = MUSCLE_META[entry.muscle] ? MUSCLE_META[entry.muscle].label : entry.muscle;
            (entry.sets || []).forEach((s, idx) => {
              rows.push([
                sess.date,
                `"${String(sess.dayTitle || '').replace(/"/g, '""')}"`,
                `"${String(entry.name || '').replace(/"/g, '""')}"`,
                mm,
                idx + 1,
                s.w,
                s.r,
                Math.round((Number(s.w) || 0) * (Number(s.r) || 0))
              ]);
            });
          }
        }
        const csvStr = '\uFEFF' + rows.map(r => r.join(',')).join('\n');
        const dateTag = new Date().toISOString().slice(0, 10);
        downloadFile(`ironlab_gym_log_${dateTag}.csv`, csvStr, 'text/csv;charset=utf-8;');
        showToast('تم تصدير سجل الأوزان (CSV)', 'success');
      }

      document.getElementById('json-import-input').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = JSON.parse(reader.result);
            if (!imported || !Array.isArray(imported.schedule) || imported.schedule.length !== 7) {
              showToast('ملف النسخة الاحتياطية غير صالح', 'error');
              return;
            }
            state = imported;
            if (!state.settings) state.settings = { theme: 'dark', defaultRestSec: 90, autoStartTimer: true, soundEnabled: true };
            if (!Array.isArray(state.history)) state.history = [];
            if (!state.drafts) state.drafts = {};
            state.schedule.forEach(d => { if (!Array.isArray(d.warmups)) d.warmups = []; });
            state.setupCompleted = true;
            saveState();
            applyTheme();
            showToast('تم استيراد النسخة الاحتياطية بنجاح!', 'success');
            switchTab('schedule');
          } catch (err) {
            showToast('تعذّر قراءة ملف JSON', 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

          const listEl = document.getElementById('ex-suggestions-list');
          const countEl = document.getElementById('ex-lib-count');
          if (countEl) countEl.textContent = `${items.length} خيارات`;
          if (!listEl) return;

          if (items.length === 0) {
            listEl.innerHTML = '<div class="text-xs text-slate-400 text-center py-2">اكتب اسم التمرين والجهاز بحرية في الحقول بالأسفل.</div>';

          listEl.querySelectorAll('[data-pick-preset]').forEach(btn => {
            btn.addEventListener('click', () => {
              const picked = items[Number(btn.dataset.pickPreset)];
              if (!picked) return;

              document.getElementById('ex-machine').value = picked.machine;
              document.getElementById('ex-tips').value = picked.tips;

        }

        document.querySelectorAll('input[name="exMuscle"], input[name="exEquipment"]').forEach(r => {
          r.addEventListener('change', renderSuggestions);
        });
        renderSuggestions();

        document.getElementById('btn-cancel-ex').addEventListener('click', closeModal);
        document.getElementById('form-exercise').addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('ex-name').value.trim();
          const machine = document.getElementById('ex-machine').value.trim();
          const muscle = document.querySelector('input[name="exMuscle"]:checked').value;
          const equipment = document.querySelector('input[name="exEquipment"]:checked').value;
          const sets = Math.max(1, Math.min(15, Number(document.getElementById('ex-sets').value) || 3));
          const repRange = document.getElementById('ex-reps').value.trim() || '8-12';
          const tips = document.getElementById('ex-tips').value.trim();
          const videoUrl = (document.getElementById('ex-video') && document.getElementById('ex-video').value.trim()) || '';
          if (!name) return;

          if (existing) {
            existing.name = name;
            existing.machine = machine;
            existing.muscle = muscle;
            existing.equipment = equipment;
            existing.sets = sets;
            existing.repRange = repRange;
            existing.tips = tips;
            existing.videoUrl = videoUrl;
            showToast('تم تحديث بيانات التمرين', 'success');
          } else {
            dayObj.exercises.push({ id: 'ex_' + Date.now(), name, machine, muscle, equipment, sets, repRange, tips, videoUrl });
            showToast('تمت إضافة التمرين بنجاح', 'success');
          }
          saveState();
          closeModal();
          renderWorkoutView();
        });
      }

      function openOlympiaTipsModal() {
        openModal('نصائح معتمدة للمبتدئين من أبطال مستر أولمبيا', `
          <div class="space-y-3">
            ${OLYMPIA_TIPS.map(tip => `
              <div class="app-subtle rounded-2xl border p-4 flex items-start gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/15 border border-emerald-500/25 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0">
                  <i data-lucide="${tip.icon}" class="w-5 h-5"></i>
                </div>
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap mb-1">
                    <span class="text-xs font-black text-slate-900 dark:text-white">${tip.champion}</span>
                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-500/15 text-amber-700 dark:text-amber-300">${tip.title}</span>
                  </div>
                  <div class="text-xs font-extrabold text-emerald-700 dark:text-emerald-400 mb-1">${tip.rule}</div>
                  <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">${tip.desc}</p>
                </div>
              </div>
            `).join('')}
          </div>
        `);
      }

      function openQuickVideoEditModal(dayId, exObj) {
        openModal('إضافة رابط فيديو شرح للتمرين', `
          <form id="form-quick-video" class="space-y-4">
            <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">الصق رابط مقطع الشرح من <strong>تيك توك (TikTok)</strong> أو <strong>يوتيوب (YouTube)</strong> أو <strong>إنستغرام</strong> لتمرين <strong class="text-slate-900 dark:text-white">${escapeHtml(exObj.name)}</strong>:</p>
            <input id="quick-video-url" type="url" dir="ltr" required value="${escapeHtml(exObj.videoUrl || '')}" placeholder="https://www.tiktok.com/... أو https://youtu.be/..." class="app-input w-full h-11 px-3.5 rounded-xl border focus:border-rose-500 text-xs outline-none text-left" />
            <div class="flex items-center justify-end gap-2">
              ${exObj.videoUrl ? '<button type="button" id="btn-remove-video" class="px-3.5 py-2.5 rounded-xl bg-rose-500/10 text-rose-500 text-xs font-bold">حذف الرابط</button>' : ''}
              <button type="button" id="btn-cancel-qvid" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300">إلغاء</button>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-rose-500 hover:bg-rose-400 text-white text-xs font-black">حفظ الفيديو</button>
            </div>
          </form>
        `);
        document.getElementById('btn-cancel-qvid').addEventListener('click', closeModal);
        const remBtn = document.getElementById('btn-remove-video');
        if (remBtn) {
          remBtn.addEventListener('click', () => {
            exObj.videoUrl = '';
            saveState();
            closeModal();
            renderWorkoutView();
            showToast('تم حذف رابط الفيديو', 'info');
          });
        }
        document.getElementById('form-quick-video').addEventListener('submit', (e) => {
          e.preventDefault();
          exObj.videoUrl = document.getElementById('quick-video-url').value.trim();
          saveState();
          closeModal();
          renderWorkoutView();
          showToast('تم حفظ رابط فيديو الشرح بنجاح!', 'success');
        });
      }

      function openVideoModal(dayId, exObj) {
        const url = exObj.videoUrl || '';
        const ytEmbed = getYouTubeEmbedUrl(url);
        const isTikTok = url.toLowerCase().includes('tiktok.com');
        const platformLabel = ytEmbed ? 'يوتيوب (YouTube)' : isTikTok ? 'تيك توك (TikTok)' : 'فيديو الشرح';

        openModal(`شرح: ${exObj.name}`, `
          <div class="space-y-4">
            ${ytEmbed ? `
              <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-black border border-slate-700">
                <iframe src="${escapeHtml(ytEmbed)}" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
              </div>
            ` : `
              <div class="app-subtle rounded-2xl border p-6 text-center">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-rose-500/15 text-rose-500 flex items-center justify-center mb-3">
                  <i data-lucide="play-circle" class="w-8 h-8"></i>
                </div>
                <div class="text-sm font-extrabold text-slate-900 dark:text-white mb-1">مقطع شرح محفوظ من ${platformLabel}</div>
                <p class="text-xs text-slate-500 dark:text-slate-400 break-all mb-4" dir="ltr">${escapeHtml(url)}</p>
                <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-rose-500 hover:bg-rose-400 text-white text-xs font-black shadow-lg shadow-rose-500/20 transition">
                  <i data-lucide="external-link" class="w-4 h-4"></i>
                  <span>فتح المقطع الآن</span>
                </a>
              </div>
            `}
            <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-200 dark:border-borderDark">
              <button id="btn-edit-video-link" class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300">تعديل / حذف الرابط</button>
              <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-xl bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 text-xs font-extrabold inline-flex items-center gap-1.5">
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                <span>فتح في تطبيق مستقل</span>
              </a>
            </div>
          </div>
        `);

        document.getElementById('btn-edit-video-link').addEventListener('click', () => {
          openQuickVideoEditModal(dayId, exObj);
        });
      }

      // =========================================================
      // SMART REST / WARM-UP TIMER
      // =========================================================
      const timerDrawer = document.getElementById('rest-timer-drawer');
      const timerDisplay = document.getElementById('timer-display');
      const timerTitleEl = document.getElementById('timer-title-label');
      const timerBar = document.getElementById('timer-progress-bar');
      const timerPlayPause = document.getElementById('timer-play-pause');
      const headerTimerText = document.getElementById('header-timer-text');
      const timerAutoCheckbox = document.getElementById('timer-auto-checkbox');
      const timerSoundToggle = document.getElementById('timer-sound-toggle');

      function formatMMSS(sec) {
        const s = Math.max(0, Math.floor(sec));
        const m = Math.floor(s / 60);
        const rem = s % 60;
        return String(m).padStart(2, '0') + ':' + String(rem).padStart(2, '0');
      }

      function updateTimerUI() {
        const formatted = formatMMSS(timerRemainingSec);
        timerDisplay.textContent = formatted;
        timerTitleEl.textContent = timerLabel;
        headerTimerText.textContent = timerRunning ? formatted : 'مؤقت';
        const pct = timerTotalSec > 0 ? Math.max(0, Math.min(100, (timerRemainingSec / timerTotalSec) * 100)) : 0;
        timerBar.style.width = pct + '%';

        timerPlayPause.innerHTML = timerRunning
          ? '<i data-lucide="pause" class="w-3.5 h-3.5"></i><span>إيقاف</span>'
          : '<i data-lucide="play" class="w-3.5 h-3.5"></i><span>تشغيل</span>';

        timerAutoCheckbox.checked = !!state.settings.autoStartTimer;
        timerSoundToggle.innerHTML = state.settings.soundEnabled
          ? '<i data-lucide="volume-2" class="w-4 h-4 text-sky-500"></i>'
          : '<i data-lucide="volume-x" class="w-4 h-4 text-slate-400"></i>';

        document.querySelectorAll('.timer-preset-btn').forEach(btn => {
          const val = Number(btn.dataset.preset);
          btn.className = val === timerTotalSec
            ? 'timer-preset-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-sky-500 text-white dark:text-slate-950 tabular-nums transition'
            : 'timer-preset-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 tabular-nums transition';
        });

        refreshIcons();
      }

      function stopTimerInterval() {
        if (timerIntervalId !== null) {
          clearInterval(timerIntervalId);
          timerIntervalId = null;
        }
        timerRunning = false;
      }

      function startRestTimer(seconds, customLabel) {
        stopTimerInterval();
        if (customLabel) timerLabel = customLabel;
        if (typeof seconds === 'number' && seconds > 0) {
          timerTotalSec = seconds;
          timerRemainingSec = seconds;
        } else if (timerRemainingSec <= 0) {
          timerRemainingSec = timerTotalSec;
        }
        timerDrawer.classList.remove('hidden');
        timerRunning = true;
        updateTimerUI();

        timerIntervalId = setInterval(() => {
          timerRemainingSec--;
          if (timerRemainingSec <= 0) {
            timerRemainingSec = 0;
            stopTimerInterval();
            updateTimerUI();
            playTimerChime();
            showToast('⏰ انتهى المؤقت! استعد للخطوة التالية', 'info');
          } else {
            updateTimerUI();
          }
        }, 1000);
      }

      document.getElementById('btn-open-timer').addEventListener('click', () => {
        if (timerDrawer.classList.contains('hidden')) {
          timerDrawer.classList.remove('hidden');
          if (!timerRunning && timerRemainingSec <= 0) {
            timerRemainingSec = state.settings.defaultRestSec || 90;
            timerTotalSec = timerRemainingSec;
          }
          updateTimerUI();
        } else {
          timerDrawer.classList.add('hidden');
        }
      });

      document.getElementById('timer-close-btn').addEventListener('click', () => {
        stopTimerInterval();
        timerDrawer.classList.add('hidden');
        updateTimerUI();
      });

      timerPlayPause.addEventListener('click', () => {
        if (timerRunning) { stopTimerInterval(); updateTimerUI(); }
        else startRestTimer();
      });

      document.getElementById('timer-minus-15').addEventListener('click', () => {
        timerRemainingSec = Math.max(5, timerRemainingSec - 15);
        updateTimerUI();
      });

      document.getElementById('timer-plus-15').addEventListener('click', () => {
        timerRemainingSec += 15;
        if (timerRemainingSec > timerTotalSec) timerTotalSec = timerRemainingSec;
        updateTimerUI();
      });

      document.querySelectorAll('.timer-preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const sec = Number(btn.dataset.preset) || 90;
          state.settings.defaultRestSec = sec;
          saveState();
          startRestTimer(sec, 'مؤقت الراحة الذكي (Rest Timer)');
        });
      });

      timerAutoCheckbox.addEventListener('change', () => {
        state.settings.autoStartTimer = timerAutoCheckbox.checked;
        saveState();
      });

      timerSoundToggle.addEventListener('click', () => {
        state.settings.soundEnabled = !state.settings.soundEnabled;
        saveState();
        updateTimerUI();
      });

      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.nav));
      });

      function initApp() {
        try {
          const nowStr = new Date().toLocaleDateString('ar-SA', { weekday: 'long', day: 'numeric', month: 'long' });
          document.getElementById('header-date-label').textContent = nowStr;
        } catch (e) {
          document.getElementById('header-date-label').textContent = 'متتبع التمارين الذكي';
        }
        applyTheme();
        updateTimerUI();
        switchTab(state.setupCompleted ? 'schedule' : 'onboarding');
      }

      initApp();
    })();
  </script>
</body>
</html>
