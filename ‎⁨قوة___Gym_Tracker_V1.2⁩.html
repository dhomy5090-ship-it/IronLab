<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>قوة • Gym Tracker V1.2</title>
  <meta name="description" content="تطبيق ويب متكامل لإدارة التمارين الرياضية والإحماء وتتبع التطور في النادي" />
  <meta name="theme-color" id="meta-theme-color" content="#090B10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="قوة Gym" />
  <link rel="manifest" id="pwa-manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%D9%82%D9%88%D8%A9%20%E2%80%A2%20Gym%20Tracker%20V1.2%22%2C%22short_name%22%3A%22%D9%82%D9%88%D8%A9%20Gym%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23090B10%22%2C%22theme_color%22%3A%22%23090B10%22%2C%22dir%22%3A%22rtl%22%2C%22lang%22%3A%22ar%22%7D" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Tajawal', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
            latin: ['Inter', 'Tajawal', 'sans-serif']
          },
          colors: {
            obsidian: '#090B10',
            surface: '#121620',
            surfaceHover: '#191F2E',
            borderDark: '#1F2738',
            accent: '#10B981',
            gold: '#F59E0B',
            electric: '#38BDF8'
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --bg-app: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --bg-input: #FFFFFF;
      --border-main: #E2E8F0;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --glass-header: rgba(255, 255, 255, 0.90);
      --glass-nav: rgba(255, 255, 255, 0.95);
    }

    html.dark {
      color-scheme: dark;
      --bg-app: #090B10;
      --bg-card: #121620;
      --bg-subtle: #0D111A;
      --bg-input: #0F172A;
      --border-main: #1F2738;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --glass-header: rgba(9, 11, 16, 0.86);
      --glass-nav: rgba(12, 16, 24, 0.95);
    }

    html:not(.dark) {
      color-scheme: light;
    }

    html, body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: 'Tajawal', 'Inter', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      min-height: 100dvh;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-card {
      background-color: var(--bg-card);
      border-color: var(--border-main);
    }

    .app-subtle {
      background-color: var(--bg-subtle);
      border-color: var(--border-main);
    }

    .app-input {
      background-color: var(--bg-input);
      border-color: var(--border-main);
      color: var(--text-main);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-family: 'Inter', 'Tajawal', sans-serif;
    }

    .glass-header {
      background: var(--glass-header);
      border-color: var(--border-main);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding-top: var(--safe-top);
    }

    .bottom-nav {
      background: var(--glass-nav);
      border-color: var(--border-main);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding-bottom: calc(var(--safe-bottom) + 0.35rem);
    }

    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #64748B55; border-radius: 999px; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.30); }
      50% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
    }
    .pulse-today { animation: pulseGlow 2.4s infinite; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.24s ease-out forwards; }
  </style>
</head>
<body class="selection:bg-emerald-500/30">

  <!-- Top App Bar -->
  <header class="glass-header sticky top-0 z-40 border-b">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-2 sm:gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/20 shrink-0">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 6.5h11"></path>
            <path d="M6.5 17.5h11"></path>
            <path d="M3 10v4"></path>
            <path d="M21 10v4"></path>
            <path d="M6 7v10"></path>
            <path d="M18 7v10"></path>
            <path d="M6 12h12"></path>
          </svg>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 sm:gap-2">
            <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-slate-900 dark:text-white truncate">قوة <span class="text-slate-500 dark:text-slate-400 font-semibold text-sm hidden sm:inline">• Gym Tracker</span></h1>
            <span class="px-2 py-0.5 text-[11px] font-bold rounded-full bg-emerald-500/15 text-emerald-700 dark:text-emerald-400 border border-emerald-500/30 tabular-nums shrink-0">V1.2</span>
          </div>
          <p id="header-date-label" class="text-xs text-slate-500 dark:text-slate-400 truncate"></p>
        </div>
      </div>

      <!-- Desktop Navigation Pills -->
      <nav id="desktop-nav" class="hidden md:flex items-center gap-1 app-card border p-1 rounded-xl" aria-label="التنقل الرئيسي">
        <button data-nav="schedule" class="nav-btn px-3.5 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition">
          <i data-lucide="calendar-days" class="w-4 h-4"></i>
          <span>الجدول</span>
        </button>
        <button data-nav="workout" class="nav-btn px-3.5 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition">
          <i data-lucide="dumbbell" class="w-4 h-4"></i>
          <span>التمرين</span>
        </button>
        <button data-nav="progress" class="nav-btn px-3.5 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition">
          <i data-lucide="trending-up" class="w-4 h-4"></i>
          <span>التطور</span>
        </button>
        <button data-nav="data" class="nav-btn px-3.5 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition">
          <i data-lucide="database" class="w-4 h-4"></i>
          <span>السجل والنسخ</span>
        </button>
      </nav>

      <!-- Header Actions: Theme Toggle + Rest Timer -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="btn-theme-toggle" title="تبديل الوضع الليلي / النهاري" class="h-10 px-2.5 sm:px-3 rounded-xl app-card border hover:border-emerald-500/50 flex items-center gap-1.5 text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200 transition active:scale-95">
          <span id="theme-icon-wrap" class="flex items-center justify-center"></span>
          <span id="theme-label" class="hidden sm:inline">نهاري</span>
        </button>
        <button id="btn-open-timer" class="h-10 px-2.5 sm:px-3 rounded-xl app-card border hover:border-sky-500/50 flex items-center gap-1.5 text-xs sm:text-sm font-bold text-slate-700 dark:text-slate-200 transition active:scale-95">
          <i data-lucide="timer" class="w-4 h-4 text-sky-500 dark:text-sky-400"></i>
          <span id="header-timer-text" class="tabular-nums">مؤقت</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-5xl mx-auto px-4 pt-5 pb-36 md:pb-28">
    <div id="view-onboarding" class="view-section hidden"></div>
    <div id="view-schedule" class="view-section hidden"></div>
    <div id="view-workout" class="view-section hidden"></div>
    <div id="view-progress" class="view-section hidden"></div>
    <div id="view-data" class="view-section hidden"></div>
  </main>

  <!-- Floating Rest Timer Bar -->
  <div id="rest-timer-drawer" class="hidden fixed left-3 right-3 bottom-20 md:bottom-5 md:left-auto md:right-6 md:w-96 z-40 animate-slide-up">
    <div class="app-card border border-sky-500/50 rounded-2xl p-4 shadow-2xl">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-sky-500 animate-pulse"></span>
          <span id="timer-title-label" class="text-xs font-bold text-sky-600 dark:text-sky-300">مؤقت الراحة الذكي (Rest Timer)</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="timer-sound-toggle" title="تفعيل/كتم الصوت" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 transition">
            <i data-lucide="volume-2" class="w-4 h-4"></i>
          </button>
          <button id="timer-close-btn" title="إغلاق المؤقت" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-400 transition">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between gap-3 my-2">
        <div id="timer-display" class="text-4xl font-black text-slate-900 dark:text-white tabular-nums tracking-tight">01:30</div>
        <div class="flex items-center gap-1.5">
          <button id="timer-minus-15" class="px-2.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 tabular-nums active:scale-95 transition">-15ث</button>
          <button id="timer-plus-15" class="px-2.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 tabular-nums active:scale-95 transition">+15ث</button>
          <button id="timer-play-pause" class="px-3.5 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-white dark:text-slate-950 text-xs font-extrabold flex items-center gap-1 active:scale-95 transition">
            <i data-lucide="pause" class="w-3.5 h-3.5"></i>
            <span>إيقاف</span>
          </button>
        </div>
      </div>

      <div class="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden mb-3">
        <div id="timer-progress-bar" class="h-full bg-gradient-to-l from-sky-500 to-emerald-500 transition-all duration-300" style="width: 100%"></div>
      </div>

      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div class="flex items-center gap-1.5">
          <button data-preset="60" class="timer-preset-btn px-2.5 py-1 rounded-lg text-xs font-bold tabular-nums transition">60ث</button>
          <button data-preset="90" class="timer-preset-btn px-2.5 py-1 rounded-lg text-xs font-bold tabular-nums transition">90ث</button>
          <button data-preset="120" class="timer-preset-btn px-2.5 py-1 rounded-lg text-xs font-bold tabular-nums transition">120ث</button>
        </div>
        <label class="flex items-center gap-1.5 text-xs text-slate-600 dark:text-slate-300 cursor-pointer select-none">
          <input id="timer-auto-checkbox" type="checkbox" class="w-4 h-4 rounded accent-emerald-500" />
          <span>بدء تلقائي بعد الجولة</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav id="mobile-nav" class="bottom-nav md:hidden fixed bottom-0 left-0 right-0 z-40 border-t" aria-label="التنقل السفلي">
    <div class="grid grid-cols-4 gap-1 px-2 pt-1.5">
      <button data-nav="schedule" class="mobile-nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl transition">
        <i data-lucide="calendar-days" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px] font-bold">الجدول</span>
      </button>
      <button data-nav="workout" class="mobile-nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl transition">
        <i data-lucide="dumbbell" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px] font-bold">التمرين</span>
      </button>
      <button data-nav="progress" class="mobile-nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl transition">
        <i data-lucide="trending-up" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px] font-bold">التطور</span>
      </button>
      <button data-nav="data" class="mobile-nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl transition">
        <i data-lucide="database" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px] font-bold">السجل</span>
      </button>
    </div>
  </nav>

  <!-- Generic Modal Container -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-50 bg-black/65 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-card" class="w-full sm:max-w-lg app-card border rounded-t-3xl sm:rounded-2xl max-h-[90dvh] flex flex-col overflow-hidden shadow-2xl animate-slide-up">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-200 dark:border-borderDark">
        <h3 id="modal-title" class="text-lg font-extrabold text-slate-900 dark:text-white"></h3>
        <button id="modal-close" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modal-body" class="p-5 overflow-y-auto custom-scroll"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-20 left-4 right-4 sm:left-auto sm:right-6 sm:w-96 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Hidden File Input for JSON Import -->
  <input type="file" id="json-import-input" accept=".json,application/json" class="hidden" />

      function inferEquipment(ex) {
        if (ex && ex.equipment && EQUIPMENT_META[ex.equipment]) return ex.equipment;
        const txt = ((ex && ex.machine) || '' + ' ' + ((ex && ex.name) || '')).toLowerCase();
        if (txt.includes('cable') || txt.includes('كيبل') || txt.includes('حبل') || txt.includes('pulley')) return 'cable';
        if (txt.includes('barbell') || txt.includes('ez-bar') || txt.includes('بار') || txt.includes('smith') || txt.includes('سميث')) return 'barbell';
        if (txt.includes('dumbbell') || txt.includes('دمبل') || txt.includes(' db ')) return 'dumbbell';
        if (txt.includes('bodyweight') || txt.includes('وزن الجسم') || txt.includes('عقلة') || txt.includes('بلانك')) return 'bodyweight';
        return 'machine';
      }

        d.setDate(d.getDate() - days);
        return d.toISOString().slice(0, 10);

      // Onboarding local selection before confirming

      // Timer state
      let timerTotalSec = state.settings.defaultRestSec || 90;
      let timerRemainingSec = timerTotalSec;
      let timerRunning = false;
      let timerIntervalId = null;
      let timerLabel = 'مؤقت الراحة الذكي (Rest Timer)';

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.schedule) && parsed.schedule.length === 7) {
              if (!parsed.settings) parsed.settings = { theme: 'dark', defaultRestSec: 90, autoStartTimer: true, soundEnabled: true };
              if (!parsed.settings.theme) parsed.settings.theme = 'dark';
              if (!Array.isArray(parsed.history)) parsed.history = [];
              if (!parsed.drafts) parsed.drafts = {};
              parsed.schedule.forEach(d => {
                if (!Array.isArray(d.warmups)) d.warmups = [];
                if (!Array.isArray(d.exercises)) d.exercises = [];
              });
              return parsed;
            }
          }
        } catch (e) {}
        return createFreshState();
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      // ---- Theme Management (Dark / Light Mode) ----
      function applyTheme() {
        const isDark = state.settings.theme !== 'light';
        document.documentElement.classList.toggle('dark', isDark);
        const metaTheme = document.getElementById('meta-theme-color');
        if (metaTheme) metaTheme.setAttribute('content', isDark ? '#090B10' : '#FFFFFF');

        const iconWrap = document.getElementById('theme-icon-wrap');
        const label = document.getElementById('theme-label');
        if (iconWrap) {
          iconWrap.innerHTML = isDark
            ? '<i data-lucide="sun" class="w-4 h-4 text-amber-400"></i>'
            : '<i data-lucide="moon" class="w-4 h-4 text-indigo-600"></i>';
        }
        if (label) {
          label.textContent = isDark ? 'نهاري' : 'ليلي';
        }
        refreshIcons();

        if (currentTab === 'progress') {
          renderProgressView();
        }
      }

        showToast(state.settings.theme === 'light' ? 'تم التبديل للوضع النهاري الأبيض ☀️' : 'تم التبديل للوضع الليلي الداكن 🌙', 'info');
      });

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDateAr(isoStr) {
        try {
          const d = new Date(isoStr + (isoStr.length === 10 ? 'T12:00:00' : ''));
          return d.toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' });
        } catch (e) {
          return isoStr;
        }
      }

      function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const styles = {
          success: 'bg-emerald-600 dark:bg-emerald-950/95 border-emerald-400/60 text-white dark:text-emerald-100',
          pr:      'bg-amber-500 dark:bg-amber-950/95 border-amber-300 text-slate-950 dark:text-amber-100',
          error:   'bg-rose-600 dark:bg-rose-950/95 border-rose-400/60 text-white dark:text-rose-100',
          info:    'bg-slate-900 border-sky-500/40 text-white'
        };
        const icons = { success: 'check-circle-2', pr: 'trophy', error: 'alert-circle', info: 'info' };
        toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl border shadow-xl backdrop-blur-md text-sm font-bold animate-slide-up ${styles[type] || styles.info}`;
        toast.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0"></i><span class="leading-snug">${escapeHtml(message)}</span>`;
        container.appendChild(toast);
        refreshIcons();
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-8px)';
          toast.style.transition = 'all 0.25s ease';
          setTimeout(() => toast.remove(), 260);
        }, type === 'pr' ? 4200 : 2800);
      }

      function refreshIcons() {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }

      function playTimerChime() {
        if (!state.settings.soundEnabled) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const now = ctx.currentTime;
          [880, 1174.66].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.18);
            gain.gain.setValueAtTime(0.001, now + idx * 0.18);
            gain.gain.exponentialRampToValueAtTime(0.22, now + idx * 0.18 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.18 + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.18);
            osc.stop(now + idx * 0.18 + 0.24);
          });
        } catch (e) {}
        try { if (navigator.vibrate) navigator.vibrate([180, 90, 220]); } catch (e) {}
      }

      function celebratePR(exName, newWeight) {
        showToast(`🏆 رقم قياسي جديد (PR)! ${exName} — ${newWeight} كجم`, 'pr');
        if (typeof window.confetti === 'function') {
          try {
            window.confetti({ particleCount: 70, spread: 65, origin: { y: 0.7 }, colors: ['#F59E0B', '#10B981', '#38BDF8', '#FFFFFF'] });
          } catch (e) {}
        }
      }

      // ---- Analytics Helpers ----
      function getExerciseHistory(exerciseId) {
        const records = [];
        const sorted = [...state.history].sort((a, b) => a.date.localeCompare(b.date));
        for (const sess of sorted) {
          const entry = (sess.entries || []).find(e => e.exerciseId === exerciseId);
          if (entry && entry.sets && entry.sets.length > 0) {
            let maxW = 0, vol = 0, bestSet = null;
            for (const s of entry.sets) {
              const w = Number(s.w) || 0;
              const r = Number(s.r) || 0;
              vol += w * r;
              if (w > maxW || (w === maxW && (!bestSet || r > bestSet.r))) {
                maxW = w;
                bestSet = { w, r };
              }
            }
            records.push({ date: sess.date, maxWeight: maxW, volume: Math.round(vol), sets: entry.sets, bestSet });
          }
        }
        return records;
      }

      function getExercisePR(exerciseId) {
        const hist = getExerciseHistory(exerciseId);
        let maxW = 0, maxVol = 0;
        for (const h of hist) {
          if (h.maxWeight > maxW) maxW = h.maxWeight;
          if (h.volume > maxVol) maxVol = h.volume;
        }
        return { maxWeight: maxW, maxVolume: maxVol };
      }

      function getLastSessionForExercise(exerciseId) {
        const hist = getExerciseHistory(exerciseId);
        return hist.length > 0 ? hist[hist.length - 1] : null;
      }

      function getAllUniqueExercises() {
        const map = new Map();
        for (const day of state.schedule) {
          for (const ex of day.exercises || []) {
            if (!map.has(ex.id)) map.set(ex.id, { id: ex.id, name: ex.name, muscle: ex.muscle, machine: ex.machine });
          }
        }
        for (const sess of state.history) {
          for (const entry of sess.entries || []) {
            if (!map.has(entry.exerciseId)) map.set(entry.exerciseId, { id: entry.exerciseId, name: entry.name, muscle: entry.muscle || 'chest', machine: '' });
          }
        }
        return Array.from(map.values());
      }

      function isDayCompletedThisWeek(dayId) {
        const cutoff = isoDaysAgo(6);
        return state.history.some(s => s.dayId === dayId && s.date >= cutoff);
      }

      function ensureDayDraft(dayObj) {
        if (!state.drafts[dayObj.dayId]) {
          state.drafts[dayObj.dayId] = { warmupsDone: {} };
        }
        const dayDraft = state.drafts[dayObj.dayId];
        if (!dayDraft.warmupsDone) dayDraft.warmupsDone = {};

        for (const ex of dayObj.exercises) {
          if (!dayDraft[ex.id] || !Array.isArray(dayDraft[ex.id].sets)) {
            const last = getLastSessionForExercise(ex.id);
            const targetSets = Math.max(1, Number(ex.sets) || 3);
            const defaultReps = parseInt(String(ex.repRange || '10').split('-')[0], 10) || 10;
            const setsArr = [];
            for (let i = 0; i < targetSets; i++) {
              const prevSet = last && last.sets[i] ? last.sets[i] : (last && last.sets[0] ? last.sets[0] : null);
              setsArr.push({
                w: prevSet ? prevSet.w : '',
                r: prevSet ? prevSet.r : defaultReps,
                done: false,
                isPR: false
              });
            }
            dayDraft[ex.id] = { sets: setsArr };
          }
        }
        return dayDraft;
      }

              </div>
              <div class="w-full h-2.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-l from-emerald-500 to-teal-500 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
              </div>
            </div>

            <!-- Quick KPIs -->
            <div class="grid grid-cols-3 gap-2.5 sm:gap-4">
              <div class="app-subtle rounded-2xl border p-3 text-center">
                <div class="text-xs text-slate-500 dark:text-slate-400 mb-1">الجلسات المسجلة</div>
                <div class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white tabular-nums">${totalSessions}</div>
              </div>
              <div class="app-subtle rounded-2xl border p-3 text-center">
                <div class="text-xs text-slate-500 dark:text-slate-400 mb-1">حجم الأسبوع (كجم)</div>
                <div class="text-xl sm:text-2xl font-black text-sky-600 dark:text-sky-400 tabular-nums">${lastWeekVol.toLocaleString('en-US')}</div>
              </div>
              <div class="app-subtle rounded-2xl border p-3 text-center">
                <div class="text-xs text-slate-500 dark:text-slate-400 mb-1">أرقام قياسية PR</div>
                <div class="text-xl sm:text-2xl font-black text-amber-500 dark:text-amber-400 tabular-nums">${totalPRs}</div>
              </div>
            </div>
          </section>

          <!-- 7 Days Grid Header -->
          <div class="flex items-center justify-between gap-2 mb-3.5 flex-wrap">
            <h3 class="text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
              <i data-lucide="calendar-range" class="w-5 h-5 text-emerald-500"></i>
              <span>الجدول الأسبوعي (السبت – الجمعة)</span>
            </h3>
            <button id="btn-change-split" class="px-3 py-1.5 rounded-xl app-card border hover:border-emerald-500/50 text-xs font-bold text-slate-600 dark:text-slate-300 flex items-center gap-1.5 transition">
              <i data-lucide="repeat" class="w-3.5 h-3.5 text-emerald-500"></i>
              <span>تغيير النظام التدريبي</span>
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
            ${cardsHtml}
          </div>
        `;

        container.querySelectorAll('[data-open-day]').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedDayId = btn.dataset.openDay;
            switchTab('workout');
          });
        });

        container.querySelectorAll('[data-edit-day]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openEditDayModal(btn.dataset.editDay);
          });
        });

        document.getElementById('btn-change-split').addEventListener('click', () => {
          pendingSplitId = state.selectedSplit || 'ppl';
          pendingCardioId = state.preferredCardio || 'treadmill';
          switchTab('onboarding');
        });

        refreshIcons();
      }

      // =========================================================
      // VIEW 2: ACTIVE WORKOUT (WARM-UP + LIFTING)
      // =========================================================
      function renderWorkoutView() {
        const container = document.getElementById('view-workout');
        const dayObj = state.schedule.find(d => d.dayId === selectedDayId) || state.schedule[0];
        const dayMeta = DAYS_ORDER.find(d => d.id === dayObj.dayId);
        const todayId = getTodayDayId();

        const dayPillsHtml = DAYS_ORDER.map(d => {
          const dObj = state.schedule.find(x => x.dayId === d.id);
          const active = d.id === dayObj.dayId;
          const isToday = d.id === todayId;
          return `
            <button data-select-day="${d.id}" class="shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold border transition flex items-center gap-1.5 ${
              active
                ? 'bg-emerald-500 text-white dark:text-slate-950 border-emerald-500 shadow-md shadow-emerald-500/20'
                : 'app-card text-slate-600 dark:text-slate-300 hover:border-slate-400 dark:hover:border-slate-600'
            }">
              <span>${d.ar}</span>
              ${isToday ? `<span class="w-1.5 h-1.5 rounded-full ${active ? 'bg-white dark:bg-slate-950' : 'bg-emerald-500'}"></span>` : ''}
              ${dObj.type === 'rest' ? '<i data-lucide="moon" class="w-3 h-3 opacity-75"></i>' : ''}
            </button>
          `;
        }).join('');

        // REST DAY VIEW
        if (dayObj.type === 'rest') {
          container.innerHTML = `
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-3 mb-4">${dayPillsHtml}</div>

            <div class="app-card rounded-3xl border border-indigo-400/40 p-6 sm:p-8 text-center mb-6">
              <div class="w-16 h-16 mx-auto rounded-2xl bg-indigo-500/15 border border-indigo-500/30 text-indigo-600 dark:text-indigo-300 flex items-center justify-center mb-4">
                <i data-lucide="moon-star" class="w-8 h-8"></i>
              </div>
              <h2 class="text-2xl font-black text-slate-900 dark:text-white mb-1">${escapeHtml(dayObj.title)}</h2>
              <p class="text-sm text-slate-500 dark:text-indigo-200/80 max-w-md mx-auto mb-5">${escapeHtml(dayObj.subtitle || 'العضلات تنمو أثناء الراحة، وليس داخل النادي فقط. استمتع باستشفاء هادئ اليوم.')}</p>
              <button id="btn-edit-this-day" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 inline-flex items-center gap-2 transition">
                <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                <span>تحويل إلى يوم تمرين أو تعديل</span>
              </button>
            </div>

            <h3 class="text-base font-extrabold text-slate-900 dark:text-white mb-3 flex items-center gap-2">
              <i data-lucide="heart-pulse" class="w-5 h-5 text-indigo-500"></i>
              <span>نصائح الاستشفاء العضلي ليوم الراحة</span>
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              ${RECOVERY_TIPS.map(tip => `
                <div class="app-card rounded-2xl border p-4 flex items-start gap-3.5">
                  <div class="w-10 h-10 rounded-xl bg-indigo-500/15 text-indigo-600 dark:text-indigo-300 flex items-center justify-center shrink-0">
                    <i data-lucide="${tip.icon}" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h4 class="text-sm font-extrabold text-slate-900 dark:text-white mb-1">${tip.title}</h4>
                    <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">${tip.desc}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
          bindWorkoutDayPills(container);
          const editBtn = document.getElementById('btn-edit-this-day');
          if (editBtn) editBtn.addEventListener('click', () => openEditDayModal(dayObj.dayId));
          refreshIcons();
          return;
        }

        // WORKOUT DAY VIEW
        const dayDraft = ensureDayDraft(dayObj);
        if (!Array.isArray(dayObj.warmups)) dayObj.warmups = [];

        let liveTotalSets = 0, liveDoneSets = 0, liveTotalVolume = 0, livePRCount = 0;
        for (const ex of dayObj.exercises) {
          const sets = (dayDraft[ex.id] && dayDraft[ex.id].sets) || [];
          liveTotalSets += sets.length;
          for (const s of sets) {
            if (s.done) {
              liveDoneSets++;
              liveTotalVolume += (Number(s.w) || 0) * (Number(s.r) || 0);
              if (s.isPR) livePRCount++;
            }
          }
        }

        const warmupsDoneCount = dayObj.warmups.filter(w => dayDraft.warmupsDone[w.id]).length;

        // Warm-up Section HTML
        const warmupsHtml = `
          <section class="app-card rounded-2xl border border-amber-500/40 overflow-hidden mb-5 shadow-sm">
            <div class="px-4 py-3.5 bg-amber-500/10 border-b border-amber-500/20 flex items-center justify-between gap-2 flex-wrap">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-amber-500 text-white dark:text-slate-950 flex items-center justify-center shrink-0">
                  <i data-lucide="flame" class="w-5 h-5"></i>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <h3 class="text-sm sm:text-base font-black text-slate-900 dark:text-white">أولاً: الإحماء والتسخين قبل الحديد (Warm-up)</h3>
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-800 dark:text-amber-300 tabular-nums">${warmupsDoneCount}/${dayObj.warmups.length}</span>
                  </div>
                  <p class="text-[11px] text-slate-600 dark:text-slate-400">سخّن جسمك ومفاصلك قبل رفع الأوزان لرفع الأداء ومنع الإصابات</p>
                </div>
              </div>
              <button id="btn-add-warmup" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-white dark:text-slate-950 text-xs font-extrabold flex items-center gap-1 active:scale-95 transition">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>إضافة إحماء</span>
              </button>
            </div>

            <div class="p-3 sm:p-4 space-y-2">
              ${dayObj.warmups.length === 0 ? `
                <div class="text-center py-4 text-xs text-slate-500 dark:text-slate-400">
                  لا توجد فقرات إحماء مضافة لهذا اليوم — اضغط "إضافة إحماء" لإضافة السير أو الدراجة أو الإطالات.
                </div>
              ` : dayObj.warmups.map(w => {
                const done = !!dayDraft.warmupsDone[w.id];
                return `
                  <div class="flex items-center justify-between gap-2 p-2.5 sm:p-3 rounded-xl border transition ${
                    done
                      ? 'bg-emerald-500/10 border-emerald-500/35'
                      : 'app-subtle'
                  }">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <button data-toggle-warmup="${w.id}" title="إتمام الإحماء" class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 transition active:scale-90 ${
                        done
                          ? 'bg-emerald-500 text-white dark:text-slate-950 shadow-sm'
                          : 'bg-slate-200 dark:bg-slate-800 text-slate-500 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700'
                      }">
                        <i data-lucide="check" class="w-4 h-4"></i>
                      </button>
                      <div class="min-w-0">
                        <div class="text-xs sm:text-sm font-extrabold ${done ? 'line-through text-slate-400' : 'text-slate-900 dark:text-white'} truncate">${escapeHtml(w.name)}</div>
                        <div class="text-[11px] text-slate-500 dark:text-slate-400 truncate">
                          <span class="font-bold text-amber-600 dark:text-amber-400 tabular-nums">${w.durationMin} دقائق</span>${w.details ? ' • ' + escapeHtml(w.details) : ''}
                        </div>
                      </div>
                    </div>

                    <div class="flex items-center gap-1 shrink-0">
                      <button data-start-wu-timer="${w.durationMin}" data-wu-name="${escapeHtml(w.name)}" title="تشغيل مؤقت الإحماء" class="px-2.5 py-1.5 rounded-lg bg-amber-500/15 hover:bg-amber-500/25 text-amber-700 dark:text-amber-300 text-[11px] font-bold flex items-center gap-1 transition">
                        <i data-lucide="timer" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">مؤقت</span>
                      </button>
                      <button data-delete-warmup="${w.id}" title="حذف فقرة الإحماء" class="w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 dark:text-rose-400 flex items-center justify-center transition">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        `;

        // Exercises List HTML
        const exercisesHtml = dayObj.exercises.length === 0
          ? `
            <div class="app-card rounded-3xl border border-dashed p-10 text-center">
              <div class="w-14 h-14 mx-auto rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mb-3">
                <i data-lucide="dumbbell" class="w-7 h-7"></i>
              </div>
              <h3 class="text-base font-extrabold text-slate-900 dark:text-white mb-1">لا توجد تمارين حديد في هذا اليوم بعد</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">ابدأ بإضافة تمارينك والأجهزة المخصصة لهذا اليوم.</p>
              <button id="btn-empty-add-ex" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white dark:text-slate-950 font-extrabold text-sm inline-flex items-center gap-2 transition">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>إضافة تمرين جديد</span>
              </button>
            </div>
          `
          : dayObj.exercises.map((ex, exIdx) => {
              const mm = MUSCLE_META[ex.muscle] || MUSCLE_META.chest;
              const lastSess = getLastSessionForExercise(ex.id);
              const prInfo = getExercisePR(ex.id);
              const sets = dayDraft[ex.id].sets;
              const exVol = sets.reduce((sum, s) => sum + (s.done ? (Number(s.w) || 0) * (Number(s.r) || 0) : 0), 0);
              const exDoneCount = sets.filter(s => s.done).length;

              const setsRowsHtml = sets.map((s, sIdx) => {
                const prevSet = lastSess && lastSess.sets[sIdx] ? lastSess.sets[sIdx] : null;
                const prevText = prevSet ? `${prevSet.w} كجم × ${prevSet.r}` : '—';
                return `
                  <div class="grid grid-cols-12 items-center gap-1.5 sm:gap-2 p-2 rounded-xl border transition ${
                    s.done
                      ? 'bg-emerald-500/10 border-emerald-500/40'
                      : 'app-subtle'
                  }">
                    <div class="col-span-2 sm:col-span-1 text-center">
                      <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg text-xs font-black tabular-nums ${
                        s.done ? 'bg-emerald-500 text-white dark:text-slate-950' : 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300'
                      }">${sIdx + 1}</span>
                    </div>

                    <div class="col-span-3 sm:col-span-3 text-center">
                      <div class="text-[10px] text-slate-400 leading-none mb-0.5">السابق</div>
                      <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400 tabular-nums truncate">${prevText}</div>
                    </div>

                    <div class="col-span-3 sm:col-span-3">
                      <input
                        type="number"
                        inputmode="decimal"
                        step="0.5"
                        min="0"
                        placeholder="كجم"
                        value="${s.w !== '' ? s.w : ''}"
                        data-set-input="w"
                        data-ex-id="${ex.id}"
                        data-set-idx="${sIdx}"
                        class="app-input w-full h-11 px-2 text-center rounded-xl border focus:border-emerald-500 focus:outline-none text-sm font-extrabold tabular-nums"
                      />
                    </div>

                    <div class="col-span-2 sm:col-span-3">
                      <input
                        type="number"
                        inputmode="numeric"
                        min="0"
                        placeholder="تكرار"
                        value="${s.r !== '' ? s.r : ''}"
                        data-set-input="r"
                        data-ex-id="${ex.id}"
                        data-set-idx="${sIdx}"
                        class="app-input w-full h-11 px-2 text-center rounded-xl border focus:border-emerald-500 focus:outline-none text-sm font-extrabold tabular-nums"
                      />
                    </div>

                    <div class="col-span-2 sm:col-span-2 flex items-center justify-end gap-1">
                      <button
                        data-toggle-set="${ex.id}"
                        data-set-idx="${sIdx}"
                        title="إتمام الجولة"
                        class="w-11 h-11 rounded-xl flex items-center justify-center font-black transition active:scale-90 ${
                          s.done
                            ? 'bg-emerald-500 text-white dark:text-slate-950 shadow-md shadow-emerald-500/30'
                            : 'bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300'
                        }">
                        <i data-lucide="check" class="w-5 h-5"></i>
                      </button>
                    </div>
                  </div>
                `;
              }).join('');

              return `
                <article class="app-card rounded-2xl border overflow-hidden shadow-sm">
                  <div class="p-4 border-b border-slate-200 dark:border-borderDark/80">
                    <div class="flex items-start justify-between gap-2">
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5 flex-wrap mb-1.5">
                          <span class="px-2.5 py-0.5 rounded-md text-[11px] font-bold border ${mm.bg} ${mm.text} ${mm.border}">${mm.label}</span>
                          ${(() => {
                            const eqKey = inferEquipment(ex);
                            const eq = EQUIPMENT_META[eqKey] || EQUIPMENT_META.machine;
                            return `<span class="px-2 py-0.5 rounded-md text-[11px] font-bold border inline-flex items-center gap-1 ${eq.cls}"><i data-lucide="${eq.icon}" class="w-3 h-3"></i>${eq.label}</span>`;
                          })()}
                          <span class="text-[11px] font-bold text-slate-500 dark:text-slate-400 tabular-nums">${ex.sets} جولات × ${escapeHtml(ex.repRange)} تكرار</span>
                          ${prInfo.maxWeight > 0 ? `<span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-500/15 text-amber-700 dark:text-amber-300 border border-amber-500/30 tabular-nums">PR: ${prInfo.maxWeight} كجم</span>` : ''}
                        </div>
                        <h3 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white leading-snug">${escapeHtml(ex.name)}</h3>
                        ${ex.machine ? `<p class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1 mt-0.5"><i data-lucide="cog" class="w-3.5 h-3.5 text-slate-400"></i><span>الجهاز: ${escapeHtml(ex.machine)}</span></p>` : ''}
                      </div>

                      <div class="flex items-center gap-1 shrink-0">
                        <button data-move-ex="up" data-ex-idx="${exIdx}" title="تحريك لأعلى" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center transition ${exIdx === 0 ? 'opacity-30 pointer-events-none' : ''}">
                          <i data-lucide="chevron-up" class="w-4 h-4"></i>
                        </button>
                        <button data-move-ex="down" data-ex-idx="${exIdx}" title="تحريك لأسفل" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center transition ${exIdx === dayObj.exercises.length - 1 ? 'opacity-30 pointer-events-none' : ''}">
                          <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </button>
                        <button data-edit-ex="${ex.id}" title="تعديل التمرين" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition">
                          <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                        </button>
                        <button data-delete-ex="${ex.id}" title="حذف التمرين" class="w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 dark:text-rose-400 flex items-center justify-center transition">
                          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    </div>

                    ${ex.tips ? `
                      <div class="mt-3 p-2.5 rounded-xl bg-sky-500/10 border border-sky-500/20 flex items-start gap-2">
                        <i data-lucide="lightbulb" class="w-4 h-4 text-sky-600 dark:text-sky-400 shrink-0 mt-0.5"></i>
                        <p class="text-xs text-slate-700 dark:text-sky-100/90 leading-relaxed"><span class="font-bold text-sky-700 dark:text-sky-300">إعدادات ونصيحة: </span>${escapeHtml(ex.tips)}</p>
                      </div>
                    ` : ''}
                  </div>

                  <div class="p-3 sm:p-4">
                    <div class="grid grid-cols-12 gap-1.5 sm:gap-2 px-2 mb-1.5 text-[11px] font-bold text-slate-500 dark:text-slate-400 text-center">
                      <div class="col-span-2 sm:col-span-1">جولة</div>
                      <div class="col-span-3 sm:col-span-3">آخر جلسة</div>
                      <div class="col-span-3 sm:col-span-3">الوزن (كجم)</div>
                      <div class="col-span-2 sm:col-span-3">التكرار</div>
                      <div class="col-span-2 sm:col-span-2">تم</div>
                    </div>
                    <div class="space-y-2">${setsRowsHtml}</div>

                    <div class="flex items-center justify-between gap-2 mt-3 pt-3 border-t border-slate-200 dark:border-borderDark/70 flex-wrap">
                      <div class="flex items-center gap-2">
                        <button data-add-set="${ex.id}" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center gap-1 transition">
                          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                          <span>إضافة جولة</span>
                        </button>
                        ${sets.length > 1 ? `
                          <button data-remove-set="${ex.id}" class="px-2.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800/60 hover:bg-rose-500/15 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-rose-500 transition">
                            حذف الأخيرة
                          </button>
                        ` : ''}
                      </div>
                      <div class="text-xs font-bold text-slate-500 dark:text-slate-400 tabular-nums">
                        المنجز: <span class="text-emerald-600 dark:text-emerald-400">${exDoneCount}/${sets.length}</span> • الحجم: <span class="text-slate-900 dark:text-white">${Math.round(exVol).toLocaleString('en-US')}</span> كجم
                      </div>
                    </div>
                  </div>
                </article>
              `;
            }).join('');

        container.innerHTML = `
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-3 mb-4">${dayPillsHtml}</div>

          <!-- Workout Day Header -->
          <div class="app-card rounded-3xl border p-4 sm:p-5 mb-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
              <div>
                <div class="text-xs font-bold text-emerald-600 dark:text-emerald-400 mb-0.5">${dayMeta.ar} ${dayObj.dayId === todayId ? '• اليوم' : ''}</div>
                <h2 class="text-xl font-black text-slate-900 dark:text-white">${escapeHtml(dayObj.title)}</h2>
              </div>
              <div class="flex items-center gap-2 flex-wrap">
                <button id="btn-edit-this-day" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 flex items-center gap-1.5 transition">

                </button>
                <button id="btn-add-exercise" class="px-3.5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white dark:text-slate-950 text-xs font-extrabold flex items-center gap-1.5 shadow-md shadow-emerald-500/20 active:scale-95 transition">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>إضافة تمرين جديد</span>
                </button>
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2.5 app-subtle border rounded-2xl p-3">
              <div class="text-center">
                <div class="text-[11px] text-slate-500 dark:text-slate-400">الجولات المنجزة</div>
                <div class="text-lg font-black text-emerald-600 dark:text-emerald-400 tabular-nums">${liveDoneSets} / ${liveTotalSets}</div>
              </div>
              <div class="text-center border-x border-slate-200 dark:border-borderDark/80">
                <div class="text-[11px] text-slate-500 dark:text-slate-400">الحجم التدريبي (Volume)</div>
                <div class="text-lg font-black text-slate-900 dark:text-white tabular-nums">${Math.round(liveTotalVolume).toLocaleString('en-US')} <span class="text-xs font-normal text-slate-400">كجم</span></div>
              </div>
              <div class="text-center">
                <div class="text-[11px] text-slate-500 dark:text-slate-400">أرقام قياسية اليوم</div>
                <div class="text-lg font-black text-amber-500 dark:text-amber-400 tabular-nums">${livePRCount} 🏆</div>
              </div>
            </div>
          </div>

          <!-- Warm-up Section (Before Lifting) -->
          ${warmupsHtml}

          <!-- Main Weightlifting Section Header -->
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
              <i data-lucide="dumbbell" class="w-5 h-5 text-emerald-500"></i>
              <span>ثانياً: تمارين الحديد والمقاومة</span>
            </h3>
          </div>

          <div class="space-y-4 mb-6">${exercisesHtml}</div>

          ${dayObj.exercises.length > 0 ? `
            <div class="app-card rounded-2xl border border-emerald-500/40 p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div>
                <div class="text-sm font-extrabold text-slate-900 dark:text-white">أنهيت تمرينك اليوم؟</div>
                <div class="text-xs text-slate-500 dark:text-slate-400">احفظ الجلسة في السجل لحساب التطور وتحديث الرسوم البيانية.</div>
              </div>
              <div class="flex items-center gap-2 w-full sm:w-auto">
                <button id="btn-reset-draft" class="px-3.5 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300 transition">تصفير الجولات</button>
                <button id="btn-finish-session" class="flex-1 sm:flex-none px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white dark:text-slate-950 font-black text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/25 active:scale-95 transition">
                  <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                  <span>إنهاء وحفظ الجلسة</span>
                </button>
              </div>
            </div>
          ` : ''}
        `;

        bindWorkoutDayPills(container);

        // Warm-up Handlers
        const btnAddWu = document.getElementById('btn-add-warmup');
        if (btnAddWu) btnAddWu.addEventListener('click', () => openWarmupModal(dayObj.dayId));

        container.querySelectorAll('[data-toggle-warmup]').forEach(btn => {
          btn.addEventListener('click', () => {
            const wId = btn.dataset.toggleWarmup;
            dayDraft.warmupsDone[wId] = !dayDraft.warmupsDone[wId];
            saveState();
            renderWorkoutView();
          });
        });

        container.querySelectorAll('[data-start-wu-timer]').forEach(btn => {
          btn.addEventListener('click', () => {
            const mins = Math.max(1, Number(btn.dataset.startWuTimer) || 5);
            const wuName = btn.dataset.wuName || 'الإحماء';
            startRestTimer(mins * 60, `مؤقت الإحماء: ${wuName}`);
          });
        });

        container.querySelectorAll('[data-delete-warmup]').forEach(btn => {
          btn.addEventListener('click', () => {
            const wId = btn.dataset.deleteWarmup;
            dayObj.warmups = dayObj.warmups.filter(w => w.id !== wId);
            delete dayDraft.warmupsDone[wId];
            saveState();
            renderWorkoutView();
            showToast('تم حذف فقرة الإحماء', 'info');
          });
        });

        // Day & Exercise Handlers
        const btnEditDay = document.getElementById('btn-edit-this-day');
        if (btnEditDay) btnEditDay.addEventListener('click', () => openEditDayModal(dayObj.dayId));

        const btnAddEx = document.getElementById('btn-add-exercise');
        if (btnAddEx) btnAddEx.addEventListener('click', () => openExerciseModal(dayObj.dayId, null));

        const btnEmptyAdd = document.getElementById('btn-empty-add-ex');
        if (btnEmptyAdd) btnEmptyAdd.addEventListener('click', () => openExerciseModal(dayObj.dayId, null));

        container.querySelectorAll('[data-set-input]').forEach(inp => {
          inp.addEventListener('input', () => {
            const field = inp.dataset.setInput;
            const exId = inp.dataset.exId;
            const sIdx = Number(inp.dataset.setIdx);
            const val = inp.value === '' ? '' : Number(inp.value);
            if (state.drafts[dayObj.dayId] && state.drafts[dayObj.dayId][exId]) {
              state.drafts[dayObj.dayId][exId].sets[sIdx][field] = val;
              saveState();
            }
          });
        });

        container.querySelectorAll('[data-toggle-set]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exId = btn.dataset.toggleSet;
            const sIdx = Number(btn.dataset.setIdx);
            const exObj = dayObj.exercises.find(e => e.id === exId);
            const setObj = state.drafts[dayObj.dayId][exId].sets[sIdx];

            if (!setObj.done) {
              const w = Number(setObj.w) || 0;
              const r = Number(setObj.r) || 0;
              if (r <= 0) {
                showToast('أدخل عدد التكرارات أولاً لإتمام الجولة', 'error');
                return;
              }
              setObj.done = true;

              const prevPR = getExercisePR(exId).maxWeight;
              const otherTodayMax = state.drafts[dayObj.dayId][exId].sets
                .filter((_, idx) => idx !== sIdx && _.done)
                .reduce((m, s) => Math.max(m, Number(s.w) || 0), 0);

              if (w > 0 && prevPR > 0 && w > Math.max(prevPR, otherTodayMax)) {
                setObj.isPR = true;
                celebratePR(exObj ? exObj.name : '', w);
              } else {
                setObj.isPR = false;
              }

              if (state.settings.autoStartTimer) {
                startRestTimer(state.settings.defaultRestSec || 90, 'مؤقت الراحة الذكي (Rest Timer)');
              }
            } else {
              setObj.done = false;
              setObj.isPR = false;
            }
            saveState();
            renderWorkoutView();
          });
        });

        container.querySelectorAll('[data-add-set]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exId = btn.dataset.addSet;
            const setsArr = state.drafts[dayObj.dayId][exId].sets;
            const last = setsArr[setsArr.length - 1] || { w: '', r: 10 };
            setsArr.push({ w: last.w, r: last.r, done: false, isPR: false });
            saveState();
            renderWorkoutView();
          });
        });

        container.querySelectorAll('[data-remove-set]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exId = btn.dataset.removeSet;
            const setsArr = state.drafts[dayObj.dayId][exId].sets;
            if (setsArr.length > 1) {
              setsArr.pop();
              saveState();
              renderWorkoutView();
            }
          });
        });

        container.querySelectorAll('[data-edit-ex]').forEach(btn => {
          btn.addEventListener('click', () => openExerciseModal(dayObj.dayId, btn.dataset.editEx));
        });

        container.querySelectorAll('[data-delete-ex]').forEach(btn => {
          btn.addEventListener('click', () => {
            const exId = btn.dataset.deleteEx;
            const exObj = dayObj.exercises.find(e => e.id === exId);
            openConfirmModal(
              'حذف التمرين',
              `هل تريد حذف تمرين "${exObj ? exObj.name : ''}" من هذا اليوم؟`,
              () => {
                dayObj.exercises = dayObj.exercises.filter(e => e.id !== exId);
                if (state.drafts[dayObj.dayId]) delete state.drafts[dayObj.dayId][exId];
                saveState();
                renderWorkoutView();
                showToast('تم حذف التمرين من اليوم', 'info');
              }
            );
          });
        });

        container.querySelectorAll('[data-move-ex]').forEach(btn => {
          btn.addEventListener('click', () => {
            const dir = btn.dataset.moveEx;
            const idx = Number(btn.dataset.exIdx);
            const target = dir === 'up' ? idx - 1 : idx + 1;
            if (target >= 0 && target < dayObj.exercises.length) {
              const tmp = dayObj.exercises[idx];
              dayObj.exercises[idx] = dayObj.exercises[target];
              dayObj.exercises[target] = tmp;
              saveState();
              renderWorkoutView();
            }
          });
        });

        const btnReset = document.getElementById('btn-reset-draft');
        if (btnReset) {
          btnReset.addEventListener('click', () => {
            openConfirmModal('تصفير الجولات الحالية', 'سيتم إلغاء تحديد جميع فقرات الإحماء والجولات المنجزة في هذه الجلسة الحالية.', () => {
              delete state.drafts[dayObj.dayId];
              saveState();
              renderWorkoutView();
              showToast('تم تصفير جولات اليوم', 'info');
            });
          });
        }

        const btnFinish = document.getElementById('btn-finish-session');
        if (btnFinish) {
          btnFinish.addEventListener('click', () => finishWorkoutSession(dayObj));
        }

        refreshIcons();
      }

      function bindWorkoutDayPills(container) {
        container.querySelectorAll('[data-select-day]').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedDayId = btn.dataset.selectDay;
            renderWorkoutView();
          });
        });
      }

      function finishWorkoutSession(dayObj) {
        const dayDraft = state.drafts[dayObj.dayId] || {};
        const entries = [];
        let totalVolume = 0;
        let prsCount = 0;

        for (const ex of dayObj.exercises) {
          const dEx = dayDraft[ex.id];
          if (!dEx || !Array.isArray(dEx.sets)) continue;
          const completedSets = dEx.sets
            .filter(s => s.done && (Number(s.r) || 0) > 0)
            .map(s => ({ w: Number(s.w) || 0, r: Number(s.r) || 0 }));

          if (completedSets.length > 0) {
            const prevPR = getExercisePR(ex.id).maxWeight;
            const sessionMax = Math.max(...completedSets.map(s => s.w));
            if (prevPR > 0 && sessionMax > prevPR) prsCount++;
            for (const s of completedSets) totalVolume += s.w * s.r;
            entries.push({ exerciseId: ex.id, name: ex.name, muscle: ex.muscle, sets: completedSets });
          }
        }

        if (entries.length === 0) {
          showToast('أكمل جولة واحدة على الأقل (✓) قبل حفظ الجلسة', 'error');
          return;
        }

        const warmupsCompleted = (dayObj.warmups || [])
          .filter(w => dayDraft.warmupsDone && dayDraft.warmupsDone[w.id])
          .map(w => w.name);

        const newSession = {
          id: 'sess_' + Date.now(),
          date: new Date().toISOString().slice(0, 10),
          dayId: dayObj.dayId,
          dayTitle: dayObj.title,
          totalVolume: Math.round(totalVolume),
          prsCount,
          warmupsCompleted,
          entries
        };

        state.history.push(newSession);
        delete state.drafts[dayObj.dayId];
        saveState();

        showToast(`تم حفظ الجلسة! إجمالي الحجم: ${newSession.totalVolume.toLocaleString('en-US')} كجم`, 'success');
        if (prsCount > 0 && typeof window.confetti === 'function') {
          try { window.confetti({ particleCount: 90, spread: 75, origin: { y: 0.65 } }); } catch (e) {}
        }
        selectedProgressExId = entries[0].exerciseId;
        switchTab('progress');
      }

      // =========================================================
      // VIEW 3: PROGRESS TRACKER & ANALYTICS
      // =========================================================
      function renderProgressView() {
        const container = document.getElementById('view-progress');
        const allExercises = getAllUniqueExercises();

        if (allExercises.length === 0) {
          container.innerHTML = `<div class="app-card rounded-3xl border p-10 text-center text-slate-500 dark:text-slate-400">أضف تمارين وسجل أول جلسة لك لبدء عرض مقياس التطور والرسوم البيانية.</div>`;
          return;
        }

        if (!allExercises.some(e => e.id === selectedProgressExId)) {
          selectedProgressExId = allExercises[0].id;
        }

        const activeEx = allExercises.find(e => e.id === selectedProgressExId);
        const hist = getExerciseHistory(activeEx.id);
        const mm = MUSCLE_META[activeEx.muscle] || MUSCLE_META.chest;

        let firstMax = 0, latestMax = 0, bestMax = 0, strengthPct = 0;
        let firstVol = 0, latestVol = 0, volPct = 0;
        if (hist.length > 0) {
          firstMax = hist[0].maxWeight;
          latestMax = hist[hist.length - 1].maxWeight;
          bestMax = Math.max(...hist.map(h => h.maxWeight));
          if (firstMax > 0) strengthPct = Math.round(((latestMax - firstMax) / firstMax) * 100);

          firstVol = hist[0].volume;
          latestVol = hist[hist.length - 1].volume;
          if (firstVol > 0) volPct = Math.round(((latestVol - firstVol) / firstVol) * 100);
        }

        let motivationMsg = 'سجّل أول جلسة لك من تبويب "التمرين" ليبدأ حساب تطورك تلقائياً.';
        if (hist.length === 1) {
          motivationMsg = `بداية رائعة! سجلت ${latestMax} كجم في أول جلسة — عند تسجيل الجلسة الثانية سيظهر منحنى التطور ونسبة الزيادة.`;
        } else if (hist.length >= 2) {
          if (strengthPct > 0) {
            motivationMsg = `ممتاز! تطورت قوتك بنسبة +${strengthPct}% في تمرين "${activeEx.name}" (من ${firstMax} كجم إلى ${latestMax} كجم).`;
          } else if (volPct > 0) {
            motivationMsg = `تقدم رائع في الحجم التدريبي بنسبة +${volPct}%! حتى مع ثبات الوزن، جهدك العضلي ارتفع بوضوح.`;
          } else {
            motivationMsg = `ثبات جيد عند ${latestMax} كجم — جرّب زيادة +2.5 كجم أو تكرار إضافي في الجلسة القادمة.`;
          }
        }

        const prList = allExercises
          .map(e => {
            const h = getExerciseHistory(e.id);
            const pr = h.length ? Math.max(...h.map(x => x.maxWeight)) : 0;
            const growth = (h.length >= 2 && h[0].maxWeight > 0)
              ? Math.round(((h[h.length - 1].maxWeight - h[0].maxWeight) / h[0].maxWeight) * 100)
              : null;
            return { ...e, pr, sessions: h.length, growth };
          })
          .filter(e => e.pr > 0)
          .sort((a, b) => b.pr - a.pr);

        container.innerHTML = `
          <section class="app-card rounded-3xl border p-5 mb-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
              <div>
                <h2 class="text-xl font-black text-slate-900 dark:text-white flex items-center gap-2">
                  <i data-lucide="trending-up" class="w-5 h-5 text-emerald-500"></i>
                  <span>مقياس التطور والإحصائيات</span>
                </h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">اختر أي تمرين لاستعراض منحنى الأوزان والحجم التدريبي</p>
              </div>
              <select id="progress-ex-select" class="app-input w-full sm:w-72 h-11 px-3 rounded-xl border focus:border-emerald-500 text-sm font-bold outline-none">
                ${allExercises.map(e => `<option value="${e.id}" ${e.id === activeEx.id ? 'selected' : ''}>${escapeHtml(e.name)}</option>`).join('')}
              </select>
            </div>

            <div class="rounded-2xl bg-emerald-500/10 border border-emerald-500/30 p-3.5 flex items-start gap-3 mb-4">
              <div class="w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 flex items-center justify-center shrink-0">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
              </div>
              <div>
                <div class="flex items-center gap-2 flex-wrap mb-0.5">
                  <span class="px-2 py-0.5 rounded-md text-[10px] font-bold border ${mm.bg} ${mm.text} ${mm.border}">${mm.label}</span>
                  <span class="text-xs font-extrabold text-emerald-700 dark:text-emerald-300">تحليل الأداء التلقائي</span>
                </div>
                <p class="text-sm font-bold text-slate-900 dark:text-white leading-snug">${escapeHtml(motivationMsg)}</p>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
              <div class="app-subtle rounded-2xl border p-3">
                <div class="text-[11px] text-slate-500 dark:text-slate-400 mb-1">أعلى وزن (PR)</div>
                <div class="text-xl font-black text-amber-500 dark:text-amber-400 tabular-nums">${bestMax} <span class="text-xs font-normal text-slate-400">كجم</span></div>
              </div>
              <div class="app-subtle rounded-2xl border p-3">
                <div class="text-[11px] text-slate-500 dark:text-slate-400 mb-1">تطور القوة</div>
                <div class="text-xl font-black tabular-nums ${strengthPct >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'}">${strengthPct > 0 ? '+' : ''}${strengthPct}%</div>
              </div>
              <div class="app-subtle rounded-2xl border p-3">
                <div class="text-[11px] text-slate-500 dark:text-slate-400 mb-1">آخر حجم تدريبي</div>
                <div class="text-xl font-black text-sky-600 dark:text-sky-400 tabular-nums">${latestVol.toLocaleString('en-US')} <span class="text-xs font-normal text-slate-400">كجم</span></div>
              </div>
              <div class="app-subtle rounded-2xl border p-3">
                <div class="text-[11px] text-slate-500 dark:text-slate-400 mb-1">عدد الجلسات</div>
                <div class="text-xl font-black text-slate-900 dark:text-white tabular-nums">${hist.length}</div>
              </div>
            </div>
          </section>

          ${hist.length > 0 ? `
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
              <div class="app-card rounded-2xl border p-4">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">منحنى تطور الأوزان (أعلى وزن بالكجم)</h3>
                  <span class="text-[11px] text-emerald-600 dark:text-emerald-400 font-bold">Max Weight</span>
                </div>
                <div class="relative h-64"><canvas id="chart-weight"></canvas></div>
              </div>

              <div class="app-card rounded-2xl border p-4">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">تطور الحجم التدريبي (الوزن × التكرارات)</h3>
                  <span class="text-[11px] text-sky-600 dark:text-sky-400 font-bold">Total Volume</span>
                </div>
                <div class="relative h-64"><canvas id="chart-volume"></canvas></div>
              </div>
            </div>
          ` : `
            <div class="app-card rounded-2xl border p-8 text-center text-sm text-slate-500 dark:text-slate-400 mb-6">
              لا توجد جلسات مسجلة لهذا التمرين بعد. ابدأ تمرينك الأول من تبويب "التمرين" ليظهر الرسم البياني تلقائياً.
            </div>
          `}

          <section class="app-card rounded-2xl border p-4 sm:p-5">
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2 mb-4">
              <i data-lucide="trophy" class="w-5 h-5 text-amber-500"></i>
              <span>جدار الأرقام القياسية (Personal Records)</span>
            </h3>
            ${prList.length === 0 ? '<p class="text-xs text-slate-500 dark:text-slate-400">ستظهر أرقامك القياسية هنا فور حفظ أول جلسة تمرين.</p>' : `
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                ${prList.map(item => {
                  const im = MUSCLE_META[item.muscle] || MUSCLE_META.chest;
                  return `
                    <button data-pick-pr="${item.id}" class="app-subtle text-right p-3.5 rounded-xl border hover:border-amber-500/50 flex items-center justify-between gap-3 transition">
                      <div class="min-w-0">
                        <div class="flex items-center gap-1.5 mb-1">
                          <span class="w-2 h-2 rounded-full shrink-0" style="background:${im.dot}"></span>
                          <span class="text-xs font-extrabold text-slate-900 dark:text-white truncate">${escapeHtml(item.name)}</span>
                        </div>
                        <div class="text-[11px] text-slate-500 dark:text-slate-400 tabular-nums">${item.sessions} جلسات ${item.growth !== null ? `• التطور: <span class="${item.growth >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'} font-bold">${item.growth > 0 ? '+' : ''}${item.growth}%</span>` : ''}</div>
                      </div>
                      <div class="px-3 py-1.5 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-700 dark:text-amber-300 font-black text-sm tabular-nums shrink-0">
                        ${item.pr} كجم
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            `}
          </section>
        `;

        const sel = document.getElementById('progress-ex-select');
        if (sel) {
          sel.addEventListener('change', () => {
            selectedProgressExId = sel.value;
            renderProgressView();
          });
        }

        container.querySelectorAll('[data-pick-pr]').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedProgressExId = btn.dataset.pickPr;
            renderProgressView();
          });

        const labels = hist.map(h => formatDateAr(h.date));
        const weights = hist.map(h => h.maxWeight);
        const volumes = hist.map(h => h.volume);

        const commonOptions = {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              rtl: true,
              backgroundColor: isDark ? '#0F172A' : '#1E293B',
              titleFont: { family: 'Tajawal', size: 12, weight: 'bold' },
              bodyFont: { family: 'Inter', size: 13, weight: 'bold' }

          scales: {
            x: { grid: { color: gridColor }, ticks: { color: tickColor, font: { family: 'Tajawal', size: 11 } } },
            y: { beginAtZero: false, grid: { color: gridColor }, ticks: { color: tickColor, font: { family: 'Inter', size: 11 } } }

          weightChartInstance = new Chart(wCanvas.getContext('2d'), {
            type: 'line',

              labels,
              datasets: [{

                pointRadius: 5,
                fill: true,
                tension: 0.35
              }]
            },
            options: commonOptions
          });
        }

        const vCanvas = document.getElementById('chart-volume');
        if (vCanvas) {
          volumeChartInstance = new Chart(vCanvas.getContext('2d'), {
            type: 'bar',
            data: {
              labels,
              datasets: [{

            options: {
              ...commonOptions,
              scales: { ...commonOptions.scales, y: { ...commonOptions.scales.y, beginAtZero: true } }

      function downloadFile(filename, content, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function exportJSON() {
        const dateTag = new Date().toISOString().slice(0, 10);
        downloadFile(`quwwa_gym_backup_${dateTag}.json`, JSON.stringify(state, null, 2), 'application/json');
        showToast('تم تصدير النسخة الاحتياطية (JSON)', 'success');
      }

      function exportCSV() {
        const rows = [['التاريخ', 'اليوم', 'التمرين', 'العضلة', 'الجولة', 'الوزن (كجم)', 'التكرارات', 'الحجم (كجم)']];
        for (const sess of state.history) {
          for (const entry of sess.entries || []) {
            const mm = MUSCLE_META[entry.muscle] ? MUSCLE_META[entry.muscle].label : entry.muscle;
            (entry.sets || []).forEach((s, idx) => {
              rows.push([
                sess.date,
                `"${String(sess.dayTitle || '').replace(/"/g, '""')}"`,
                `"${String(entry.name || '').replace(/"/g, '""')}"`,
                mm,
                idx + 1,
                s.w,
                s.r,
                Math.round((Number(s.w) || 0) * (Number(s.r) || 0))
              ]);
            });
          }
        }
        const csvStr = '\uFEFF' + rows.map(r => r.join(',')).join('\n');
        const dateTag = new Date().toISOString().slice(0, 10);
        downloadFile(`quwwa_gym_log_${dateTag}.csv`, csvStr, 'text/csv;charset=utf-8;');
        showToast('تم تصدير سجل الأوزان (CSV)', 'success');
      }

      document.getElementById('json-import-input').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = JSON.parse(reader.result);
            if (!imported || !Array.isArray(imported.schedule) || imported.schedule.length !== 7) {
              showToast('ملف النسخة الاحتياطية غير صالح', 'error');
              return;
            }
            state = imported;
            if (!state.settings) state.settings = { theme: 'dark', defaultRestSec: 90, autoStartTimer: true, soundEnabled: true };
            if (!Array.isArray(state.history)) state.history = [];
            if (!state.drafts) state.drafts = {};
            state.schedule.forEach(d => { if (!Array.isArray(d.warmups)) d.warmups = []; });
            state.setupCompleted = true;
            saveState();
            applyTheme();
            showToast('تم استيراد النسخة الاحتياطية بنجاح!', 'success');
            switchTab('schedule');
          } catch (err) {
            showToast('تعذّر قراءة ملف JSON', 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });
