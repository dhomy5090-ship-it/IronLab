        `);

        document.querySelectorAll('[data-day-preset]').forEach(b => {
          b.addEventListener('click', () => {
            document.getElementById('day-title-input').value = b.dataset.dayPreset;
            const targetVal = b.dataset.dayPreset.includes('راحة') ? 'rest' : 'workout';
            const radio = document.querySelector(`input[name="dayType"][value="${targetVal}"]`);
            if (radio) radio.checked = true;
          });
        });

        document.getElementById('btn-cancel-day').addEventListener('click', closeModal);
        document.getElementById('form-edit-day').addEventListener('submit', (e) => {
          e.preventDefault();
          const typeVal = document.querySelector('input[name="dayType"]:checked').value;
          dayObj.type = typeVal;
          dayObj.title = document.getElementById('day-title-input').value.trim() || (typeVal === 'rest' ? 'يوم راحة واستشفاء' : 'يوم تمرين');
          dayObj.subtitle = document.getElementById('day-sub-input').value.trim();
          if (typeVal === 'workout' && (!dayObj.warmups || dayObj.warmups.length === 0)) {
            dayObj.warmups = buildDefaultWarmups('upper', state.preferredCardio || 'treadmill');
          }
          saveState();
          closeModal();
          showToast(`تم تحديث يوم ${dayMeta.ar}`, 'success');
          if (currentTab === 'schedule') renderScheduleView();
          else if (currentTab === 'workout') renderWorkoutView();
        });
      }

      function openExerciseModal(dayId, exerciseId) {
        const dayObj = state.schedule.find(d => d.dayId === dayId);
        if (!dayObj) return;
        const existing = exerciseId ? dayObj.exercises.find(e => e.id === exerciseId) : null;
        const initMuscle = existing ? existing.muscle : 'chest';
        const initEquip = existing ? inferEquipment(existing) : 'machine';

        openModal(existing ? 'تعديل التمرين ونوع الجهاز' : 'إضافة تمرين جديد', `
          <form id="form-exercise" class="space-y-4">
            <!-- 1. Muscle Group -->
            <div>
              <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">1. العضلة المستهدفة</label>
              <div class="grid grid-cols-3 gap-2">
                ${Object.entries(MUSCLE_META).map(([key, m]) => `
                  <label class="cursor-pointer">
                    <input type="radio" name="exMuscle" value="${key}" ${initMuscle === key ? 'checked' : ''} class="peer sr-only" />
                    <div class="app-subtle py-2 px-2 rounded-xl border text-center text-xs font-bold text-slate-600 dark:text-slate-300 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/15 peer-checked:text-emerald-700 dark:peer-checked:text-emerald-300 transition">
                      ${m.label}
                    </div>
                  </label>
                `).join('')}
              </div>
            </div>

            <!-- 2. Equipment Type (Machine / Cable / Barbell / Dumbbell / Bodyweight) -->
            <div>
              <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">2. نوع الجهاز / المعدة (اختر ما يناسبك)</label>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                ${Object.entries(EQUIPMENT_META).map(([key, eq]) => `
                  <label class="cursor-pointer">
                    <input type="radio" name="exEquipment" value="${key}" ${initEquip === key ? 'checked' : ''} class="peer sr-only" />
                    <div class="app-subtle py-2 px-2.5 rounded-xl border text-center text-xs font-bold text-slate-600 dark:text-slate-300 peer-checked:border-sky-500 peer-checked:bg-sky-500/15 peer-checked:text-sky-700 dark:peer-checked:text-sky-300 flex items-center justify-center gap-1.5 transition">
                      <i data-lucide="${eq.icon}" class="w-3.5 h-3.5"></i>
                      <span>${eq.label}</span>
                    </div>
                  </label>
                `).join('')}
              </div>
            </div>

            <!-- 3. Smart Suggestions Library based on Muscle + Equipment -->
            <div class="app-subtle rounded-2xl border p-3">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-extrabold text-emerald-700 dark:text-emerald-400 flex items-center gap-1.5">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                  <span>تمارين وأجهزة جاهزة للاختيار السريع:</span>
                </span>
                <span id="ex-lib-count" class="text-[11px] font-bold text-slate-400 tabular-nums"></span>
              </div>
              <div id="ex-suggestions-list" class="space-y-1.5 max-h-44 overflow-y-auto custom-scroll"></div>
            </div>

            <!-- 4. Editable Exercise & Machine Fields -->
            <div>
              <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">اسم التمرين *</label>
              <input id="ex-name" type="text" required value="${escapeHtml(existing ? existing.name : '')}" placeholder="اختر من الأعلى أو اكتب اسم التمرين..." class="app-input w-full h-11 px-3.5 rounded-xl border focus:border-emerald-500 text-sm font-bold outline-none" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">اسم الجهاز المستخدم</label>
              <input id="ex-machine" type="text" value="${escapeHtml(existing ? existing.machine : '')}" placeholder="مثلاً: جهاز دفع الصدر (Chest Press) / كيبل / بار" class="app-input w-full h-11 px-3.5 rounded-xl border focus:border-emerald-500 text-sm outline-none" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">عدد الجولات (Sets)</label>
                <input id="ex-sets" type="number" min="1" max="15" required value="${existing ? existing.sets : 3}" class="app-input w-full h-11 px-3.5 rounded-xl border focus:border-emerald-500 text-sm font-bold tabular-nums outline-none" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">نطاق التكرارات (Reps)</label>
                <input id="ex-reps" type="text" required value="${escapeHtml(existing ? existing.repRange : '8-12')}" placeholder="8-12" class="app-input w-full h-11 px-3.5 rounded-xl border focus:border-emerald-500 text-sm font-bold tabular-nums outline-none" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 mb-1.5">ملاحظات ونصائح الأداء / إعدادات الجهاز (Form Tips)</label>
              <textarea id="ex-tips" rows="2" placeholder="مثلاً: ارتفاع المقعد رقم 4، نزول بطيء 3 ثوانٍ..." class="app-input w-full p-3 rounded-xl border focus:border-emerald-500 text-sm outline-none resize-none">${escapeHtml(existing ? existing.tips : '')}</textarea>
            </div>

            <div class="flex items-center justify-end gap-2 pt-2">
              <button type="button" id="btn-cancel-ex" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300">إلغاء</button>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-white dark:text-slate-950 text-xs font-black">${existing ? 'حفظ التعديل' : 'إضافة التمرين'}</button>
            </div>
          </form>
        `);

        function renderSuggestions() {
          const mChecked = document.querySelector('input[name="exMuscle"]:checked');
          const eChecked = document.querySelector('input[name="exEquipment"]:checked');
          const mKey = mChecked ? mChecked.value : 'chest';
          const eKey = eChecked ? eChecked.value : 'machine';
          const items = (EXERCISE_LIBRARY[mKey] && EXERCISE_LIBRARY[mKey][eKey]) || [];
          const listEl = document.getElementById('ex-suggestions-list');
          const countEl = document.getElementById('ex-lib-count');
          if (countEl) countEl.textContent = `${items.length} خيارات`;
          if (!listEl) return;

          if (items.length === 0) {
            listEl.innerHTML = '<div class="text-xs text-slate-400 text-center py-2">اكتب اسم التمرين والجهاز بحرية في الحقول بالأسفل.</div>';
            return;
          }

          listEl.innerHTML = items.map((item, idx) => `
            <button type="button" data-pick-preset="${idx}" class="app-card w-full text-right p-2.5 rounded-xl border hover:border-emerald-500 flex items-center justify-between gap-2 transition active:scale-[0.99]">
              <div class="min-w-0">
                <div class="text-xs font-extrabold text-slate-900 dark:text-white truncate">${escapeHtml(item.name)}</div>
                <div class="text-[11px] text-slate-500 dark:text-slate-400 truncate">الجهاز: ${escapeHtml(item.machine)}</div>
              </div>
              <span class="px-2 py-1 rounded-lg bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 text-[11px] font-bold shrink-0">اختيار</span>
            </button>
          `).join('');

          listEl.querySelectorAll('[data-pick-preset]').forEach(btn => {
            btn.addEventListener('click', () => {
              const picked = items[Number(btn.dataset.pickPreset)];
              if (!picked) return;
              document.getElementById('ex-name').value = picked.name;
              document.getElementById('ex-machine').value = picked.machine;
              document.getElementById('ex-tips').value = picked.tips;
              showToast(`تم اختيار: ${picked.name}`, 'info');
            });
          });
        }

        document.querySelectorAll('input[name="exMuscle"], input[name="exEquipment"]').forEach(r => {
          r.addEventListener('change', renderSuggestions);
        });
        renderSuggestions();

        document.getElementById('btn-cancel-ex').addEventListener('click', closeModal);
        document.getElementById('form-exercise').addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('ex-name').value.trim();
          const machine = document.getElementById('ex-machine').value.trim();
          const muscle = document.querySelector('input[name="exMuscle"]:checked').value;
          const equipment = document.querySelector('input[name="exEquipment"]:checked').value;
          const sets = Math.max(1, Math.min(15, Number(document.getElementById('ex-sets').value) || 3));
          const repRange = document.getElementById('ex-reps').value.trim() || '8-12';
          const tips = document.getElementById('ex-tips').value.trim();
          if (!name) return;

          if (existing) {
            existing.name = name;
            existing.machine = machine;
            existing.muscle = muscle;
            existing.equipment = equipment;
            existing.sets = sets;
            existing.repRange = repRange;
            existing.tips = tips;
            showToast('تم تحديث بيانات التمرين', 'success');
          } else {
            dayObj.exercises.push({ id: 'ex_' + Date.now(), name, machine, muscle, equipment, sets, repRange, tips });
            showToast('تمت إضافة التمرين بنجاح', 'success');
          }
          saveState();
          closeModal();
          renderWorkoutView();
        });
      }

      // =========================================================
      // SMART REST / WARM-UP TIMER
      // =========================================================
      const timerDrawer = document.getElementById('rest-timer-drawer');
      const timerDisplay = document.getElementById('timer-display');
      const timerTitleEl = document.getElementById('timer-title-label');
      const timerBar = document.getElementById('timer-progress-bar');
      const timerPlayPause = document.getElementById('timer-play-pause');
      const headerTimerText = document.getElementById('header-timer-text');
      const timerAutoCheckbox = document.getElementById('timer-auto-checkbox');
      const timerSoundToggle = document.getElementById('timer-sound-toggle');

      function formatMMSS(sec) {
        const s = Math.max(0, Math.floor(sec));
        const m = Math.floor(s / 60);
        const rem = s % 60;
        return String(m).padStart(2, '0') + ':' + String(rem).padStart(2, '0');
      }

      function updateTimerUI() {
        const formatted = formatMMSS(timerRemainingSec);
        timerDisplay.textContent = formatted;
        timerTitleEl.textContent = timerLabel;
        headerTimerText.textContent = timerRunning ? formatted : 'مؤقت';
        const pct = timerTotalSec > 0 ? Math.max(0, Math.min(100, (timerRemainingSec / timerTotalSec) * 100)) : 0;
        timerBar.style.width = pct + '%';

        timerPlayPause.innerHTML = timerRunning
          ? '<i data-lucide="pause" class="w-3.5 h-3.5"></i><span>إيقاف</span>'
          : '<i data-lucide="play" class="w-3.5 h-3.5"></i><span>تشغيل</span>';

        timerAutoCheckbox.checked = !!state.settings.autoStartTimer;
        timerSoundToggle.innerHTML = state.settings.soundEnabled
          ? '<i data-lucide="volume-2" class="w-4 h-4 text-sky-500"></i>'
          : '<i data-lucide="volume-x" class="w-4 h-4 text-slate-400"></i>';

        document.querySelectorAll('.timer-preset-btn').forEach(btn => {
          const val = Number(btn.dataset.preset);
          btn.className = val === timerTotalSec
            ? 'timer-preset-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-sky-500 text-white dark:text-slate-950 tabular-nums transition'
            : 'timer-preset-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 tabular-nums transition';
        });

        refreshIcons();
      }

      function stopTimerInterval() {
        if (timerIntervalId !== null) {
          clearInterval(timerIntervalId);
          timerIntervalId = null;
        }
        timerRunning = false;
      }

      function startRestTimer(seconds, customLabel) {
        stopTimerInterval();
        if (customLabel) timerLabel = customLabel;
        if (typeof seconds === 'number' && seconds > 0) {
          timerTotalSec = seconds;
          timerRemainingSec = seconds;
        } else if (timerRemainingSec <= 0) {
          timerRemainingSec = timerTotalSec;
        }
        timerDrawer.classList.remove('hidden');
        timerRunning = true;
        updateTimerUI();

        timerIntervalId = setInterval(() => {
          timerRemainingSec--;
          if (timerRemainingSec <= 0) {
            timerRemainingSec = 0;
            stopTimerInterval();
            updateTimerUI();
            playTimerChime();
            showToast('⏰ انتهى المؤقت! استعد للخطوة التالية', 'info');
          } else {
            updateTimerUI();
          }
        }, 1000);
      }

      document.getElementById('btn-open-timer').addEventListener('click', () => {
        if (timerDrawer.classList.contains('hidden')) {
          timerDrawer.classList.remove('hidden');
          if (!timerRunning && timerRemainingSec <= 0) {
            timerRemainingSec = state.settings.defaultRestSec || 90;
            timerTotalSec = timerRemainingSec;
          }
          updateTimerUI();
        } else {
          timerDrawer.classList.add('hidden');
        }
      });

      document.getElementById('timer-close-btn').addEventListener('click', () => {
        stopTimerInterval();
        timerDrawer.classList.add('hidden');
        updateTimerUI();
      });

      timerPlayPause.addEventListener('click', () => {
        if (timerRunning) { stopTimerInterval(); updateTimerUI(); }
        else startRestTimer();
      });

      document.getElementById('timer-minus-15').addEventListener('click', () => {
        timerRemainingSec = Math.max(5, timerRemainingSec - 15);
        updateTimerUI();
      });

      document.getElementById('timer-plus-15').addEventListener('click', () => {
        timerRemainingSec += 15;
        if (timerRemainingSec > timerTotalSec) timerTotalSec = timerRemainingSec;
        updateTimerUI();
      });

      document.querySelectorAll('.timer-preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const sec = Number(btn.dataset.preset) || 90;
          state.settings.defaultRestSec = sec;
          saveState();
          startRestTimer(sec, 'مؤقت الراحة الذكي (Rest Timer)');
        });
      });

      timerAutoCheckbox.addEventListener('change', () => {
        state.settings.autoStartTimer = timerAutoCheckbox.checked;
        saveState();
      });

      timerSoundToggle.addEventListener('click', () => {
        state.settings.soundEnabled = !state.settings.soundEnabled;
        saveState();
        updateTimerUI();
      });

      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.nav));
      });

      function initApp() {
        try {
          const nowStr = new Date().toLocaleDateString('ar-SA', { weekday: 'long', day: 'numeric', month: 'long' });
          document.getElementById('header-date-label').textContent = nowStr;
        } catch (e) {
          document.getElementById('header-date-label').textContent = 'متتبع التمارين الذكي';
        }
        applyTheme();
        updateTimerUI();
        switchTab(state.setupCompleted ? 'schedule' : 'onboarding');
      }

      initApp();
    })();
  </script>
</body>
</html>
